<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiteboard notes</title>
<style>
  :root {
    --canvas: #f9f9f7;
    --surface: #ffffff;
    --surface-2: #f5f4f0;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --border: rgba(11, 11, 11, 0.10);
    --line: rgba(11, 11, 11, 0.16);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--canvas); color: var(--text-primary); }
  body { font: 400 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  main { max-width: 640px; margin: 0 auto; padding: 56px 16px 64px; }
  h1 { margin: 0; font-size: 28px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.2; }
  .count { margin: 6px 0 24px; color: var(--text-muted); font-size: 13px; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 0.5px solid var(--line); border-radius: 8px; overflow: hidden; }
  li + li { border-top: 0.5px solid var(--border); }
  a { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 12px 16px; color: inherit; text-decoration: none; }
  a:hover { background: var(--surface-2); }
  a:focus-visible { outline: 1.5px solid var(--text-primary); outline-offset: -1.5px; }
  .title { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
  .date { flex: none; color: var(--text-secondary); font-size: 13px; font-variant-numeric: tabular-nums; }
  .empty { color: var(--text-secondary); }
  .search { display: block; width: 100%; margin: 0 0 12px; padding: 9px 14px; font: 400 14px var(--font); color: var(--text-primary); background: var(--surface); border: 0.5px solid var(--line); border-radius: 8px; outline: none; }
  .search::placeholder { color: var(--text-muted); }
  .search:focus { border-color: var(--text-secondary); }
  .no-match { margin: 12px 2px 0; color: var(--text-secondary); }
  [hidden] { display: none !important; }
  @media (max-width: 480px) {
    main { padding-top: 32px; }
    a { flex-direction: column; gap: 2px; }
  }
</style>
</head>
<body>
<main>
  <h1>Whiteboard notes</h1>
  <p class="count">1 board, newest first</p>
  <input class="search" id="search" type="search" placeholder="Search titles and notes  ( / )" aria-label="Search boards" autocomplete="off">
  <ul id="list">
      <li data-search="assembly stack frames assembly stack frames x86-64 register names 1. where things live in memory memory layout stack function data grows ↓ (subtraction) heap · data globals · statics text instructions stored ↑ (addition) 2. stack frames, rbp and rsp stack structure stack frame = 1 function call local variables rbp base pointer address of frame base rsp stack pointer address of stack top lowest addr in use (irrelevant to frame) sub rsp, 16 → allocate space ↓ add rsp, 16 → free space ↑ holds holds holds holds holds holds moves defined by held in cpu register 3. calling a function call f push return addr → jump push rbp save caller&#39;s rbp mov rbp, rsp new frame starts sub rsp, 16 allocate locals mov eax, … return value → eax add rsp, 16 free locals pop rbp restore caller&#39;s rbp ret pop return addr, jump create frame destroy frame (reverse order) body runs undoes undoes undoes calling a function, step by step push rbp only saves the old rbp mov rbp, rsp starts the new frame leave = mov rsp, rbp + pop rbp (what compilers usually emit) push x pop x copy x → stack top stack top → copy into x 4. stack overflow stack overflow deep / infinite recursion huge local arrays char buf[1 mb] stack overflow rsp passes the stack limit ↓ segfault → program crashes ≠ memory leak (leak = heap memory never freed) ≠ buffer overflow (writing past an array&#39;s end) base case limit recursion depth recursion → loop big data → heap (malloc) bigger stack (ulimit -s) last resort prevent causes result"><a href="asm-stack-frames.html"><span class="title">Assembly stack frames</span><span class="date">24 Oct 2026, 20:23</span></a></li>
  </ul>
  <p class="no-match" id="no-match" hidden>No boards match.</p>
</main>
<script>
  // Shows only the boards whose title or notes contain every word typed.
  const input = document.getElementById('search');
  if (input) {
    const items = [...document.querySelectorAll('#list li')];
    const filter = () => {
      const terms = input.value.toLowerCase().split(/\s+/).filter(Boolean);
      let shown = 0;
      for (const li of items) {
        const hit = terms.every((t) => li.dataset.search.includes(t));
        li.hidden = !hit;
        if (hit) shown++;
      }
      document.getElementById('list').hidden = shown === 0;
      document.getElementById('no-match').hidden = shown !== 0;
    };
    input.addEventListener('input', filter);
    input.addEventListener('keydown', (e) => { if (e.key === 'Escape') { input.value = ''; filter(); } });
    document.addEventListener('keydown', (e) => { if (e.key === '/' && document.activeElement !== input) { e.preventDefault(); input.focus(); } });
  }
</script>
</body>
</html>
