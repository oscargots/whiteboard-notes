      h('h2', { text: 'Shortcuts' }),
      h('h3', { text: 'Tools' }),
      rows([['V', 'Select and move'], ['T', 'Text box (or double-click empty space)'], ['A', 'Arrow: click or drag from one box to another'], ['B', 'Brace around the selected boxes'], ['P', 'Picture (you can also paste or drop images)']]),
      h('h3', { text: 'Editing' }),
      rows([['Enter', 'Edit the selected text or label'], ['Esc', 'Finish editing / clear selection'], ['S', 'Arrow: switch → and ⇒. Brace: move to next side'], ['Del', 'Delete selection'], ['Ctrl D', 'Duplicate boxes'], ['Ctrl Z', 'Undo'], ['Ctrl ⇧ Z', 'Redo'], ['Ctrl S', 'Save now / Save copy'], ['Shift', 'Hold while clicking to select several'], ['Alt', 'Hold while dragging to move off the grid']]),
      h('h3', { text: 'Arrows and braces' }),
      h('p', { text: 'Select an arrow, then drag its round end onto another box to re-point it. Drag the filled middle dot to bend it. Drag a brace to move its whole group. To change who is in a group, select the brace plus the boxes you want, then press B.' }),
      h('h3', { text: 'View' }),
      rows([['Space', 'Hold and drag to pan (or drag empty space)'], ['Ctrl+scroll', 'Zoom'], ['Pinch', 'Pinch with two fingers to zoom (drag them to pan)'], ['F', 'Fit the board on screen'], ['0', 'Zoom to 100%']]));
  }

  function toggleHelp(force) {
    ui.help.hidden = force === undefined ? !ui.help.hidden : !force;
  }

  function btn(label, iconName, fn, o = {}) {
    const b = h('button', { class: 'wb-btn', type: 'button', title: o.title || label, 'aria-pressed': o.pressed == null ? null : String(!!o.pressed) });
    if (iconName) b.append(icon(iconName));
    if (label) b.append(h('span', { class: o.keepLabel ? '' : 'wb-btn-label', text: label }));
    if (!label) { b.classList.add('wb-icon'); b.setAttribute('aria-label', o.title || ''); }

    b.addEventListener('click', (ev) => { ev.stopPropagation(); fn(); });
    return b;
  }
  const sep = () => h('div', { class: 'wb-sep' });

  function renderTray() {
    const t = ui.tray;
    t.textContent = '';
    if (isView()) {
      t.append(h('div', { class: 'wb-group' },
        btn(null, 'zoom_out', () => zoomCenter(view.z / 1.2), { title: 'Zoom out (-)' }),
        btn(null, 'zoom_in', () => zoomCenter(view.z * 1.2), { title: 'Zoom in (+)' }),
        btn('Fit', 'fit', fit, { title: 'Fit board on screen (F)', keepLabel: true })));
      return;
    }
    const tools = h('div', { class: 'wb-group' });
    tools.append(
      btn('Select', 'select', () => setTool('select'), { pressed: tool === 'select', title: 'Select and move (V)' }),
      btn('Text', 'text', () => setTool('text'), { pressed: tool === 'text', title: 'Text box (T)' }),
      btn('Arrow', 'arrow', () => setTool('arrow'), { pressed: tool === 'arrow', title: 'Arrow (A)' }),
      btn('Brace', 'brace', braceFromSelection, { title: 'Brace around the selected boxes (B)' }),
      btn('Picture', 'picture', () => ui.file.click(), { title: 'Add a picture (P). You can also paste or drop images.' }));

    const ctx = contextControls();
    if (ctx) t.append(sep(), ctx);
    const misc = h('div', { class: 'wb-group' });
    misc.append(
      btn(null, 'undo', undo, { title: 'Undo (Ctrl+Z)', disabled: !undoStack.length }),
      btn(null, 'redo', redo, { title: 'Redo (Ctrl+Shift+Z)', disabled: !redoStack.length }),
      btn(null, 'fit', fit, { title: 'Fit board on screen (F)' }),
      btn(null, 'help', () => toggleHelp(), { title: 'Shortcuts (?)' }));
    if (cfg.mode === 'dev') misc.append(btn('Export HTML', 'export', exportHTML, { title: 'Write a standalone HTML file into this board’s exports folder' }));
    else misc.append(btn('Save copy', 'export', saveCopy, { title: 'Save an HTML file with your changes (Ctrl+S)' }));
    t.append(sep(), misc);
  }

  function contextControls() {
    if (tool === 'arrow') {
      const g = h('div', { class: 'wb-group' });
      g.append(
        btn('→ Sequence', null, () => { draftStyle = 'sequence'; renderTray(); }, { pressed: draftStyle === 'sequence', keepLabel: true }),
        btn('⇒ Equivalence', null, () => { draftStyle = 'equivalence'; renderTray(); }, { pressed: draftStyle === 'equivalence', keepLabel: true }));
      return g;
    }
    const sel = [...selected].map(byId).filter(Boolean);
    if (!sel.length) return null;
    const g = h('div', { class: 'wb-group' });
    const types = new Set(sel.map((e) => e.type));
    const only = (t) => types.size === 1 && types.has(t);
    if (only('text')) {

      select.addEventListener('change', () => mutate(() => sel.forEach((e) => { e.variant = select.value; })));

        const b = h('button', { type: 'button', class: 'wb-swatch c-' + c, title: c === 'none' ? 'No color' : c[0].toUpperCase() + c.slice(1), 'aria-label': c === 'none' ? 'No color' : c, 'aria-pressed': String((sel[0].color || 'none') === c) });

    }
    if (only('arrow')) {
      const st = sel[0].style;
      g.append(
        btn('→ Sequence', null, () => mutate(() => sel.forEach((e) => { e.style = 'sequence'; })), { pressed: st === 'sequence', keepLabel: true, title: 'Sequence arrow: this leads to that' }),
        btn('⇒ Equivalence', null, () => mutate(() => sel.forEach((e) => { e.style = 'equivalence'; })), { pressed: st === 'equivalence', keepLabel: true, title: 'Equivalence arrow: this is the same as that' }));
      if (sel.length === 1) {
        g.append(btn('Label', null, () => editLabel(sel[0]), { keepLabel: true }));
        if (sel[0].curve) g.append(btn('Straighten', null, () => mutate(() => { delete sel[0].curve; }), { keepLabel: true }));
      }
    }
    if (only('brace') && sel.length === 1) {
      const b = sel[0];
      for (const sd of SIDES) g.append(btn(null, 'side_' + sd, () => mutate(() => { b.side = sd; }), { pressed: b.side === sd, title: 'Brace on the ' + sd }));
      g.append(btn('Label', null, () => editLabel(b), { keepLabel: true }));
    }
    if (types.has('brace') && sel.some(isBox) && sel.filter((e) => e.type === 'brace').length === 1) {
      g.append(btn('Set group', null, braceFromSelection, { keepLabel: true, title: 'Make the brace group exactly the selected boxes (B)' }));
    }
    if (sel.length === 1 && sel[0].type === 'picture') g.append(btn('Caption', null, () => editLabel(sel[0]), { keepLabel: true }));
    if (sel.length === 1 && sel[0].type === 'diagram') {
      g.append(btn('Title', null, () => editLabel(sel[0]), { keepLabel: true }));
      if (cfg.mode === 'dev') g.append(btn('Reload', null, () => reloadDiagram(sel[0].src), { keepLabel: true }));
    }
    g.append(btn(null, 'trash', deleteSelection, { title: 'Delete (Del)' }));
    return g;
  }

  function setTool(t) {
    if (tool === t) return;
    tool = t;
    if (t !== 'arrow') arrowDraft = null;
    ui.stage.classList.toggle('tool-text', t === 'text');
    ui.stage.classList.toggle('tool-arrow', t === 'arrow');
    renderTray();
    renderLinks();
  }

  /* ---------------- rendering ---------------- */
  function render() {
    renderBoxes();
    renderLinks();
    renderTray();
    renderStatus();
    ui.title.textContent = board.title || cfg.board || 'Whiteboard';
    document.documentElement.dataset.theme = board.theme === 'minimal' ? 'minimal' : 'marker';
  }

  function boxSig(e) { return JSON.stringify([e.type, e.text, e.variant, e.color, e.src, e.caption, e.title, bust[e.src] || 0]); }

  function renderBoxes() {
    const seen = new Set();
    const memberOf = new Set();
    for (const id of selected) { const b = byId(id); if (b && b.type === 'brace') b.members.forEach((m) => memberOf.add(m)); }
    for (const e of board.elements) {
      if (!isBox(e)) continue;
      seen.add(e.id);
      let n = nodes.get(e.id);
      const sig = boxSig(e);
      if (!n || (n.sig !== sig && editing !== e.id)) {
        const el = createBox(e);
        if (n) { if (ro) ro.unobserve(n.el); n.el.replaceWith(el); } else ui.boxes.append(el);
        n = { el, sig };
        nodes.set(e.id, n);
      }
      placeBox(n.el, e);
      n.el.classList.toggle('is-selected', selected.has(e.id));
      n.el.classList.toggle('is-member', memberOf.has(e.id) && !selected.has(e.id));
    }
    for (const [id, n] of nodes) if (!seen.has(id)) { if (ro) ro.unobserve(n.el); n.el.remove(); nodes.delete(id); }
    // keep DOM order equal to array order (later elements on top)
    let prev = null;
    for (const e of board.elements) {
      const n = nodes.get(e.id);
      if (!n) continue;
      const want = prev ? prev.nextSibling : ui.boxes.firstChild;
      if (want !== n.el) ui.boxes.insertBefore(n.el, want);
      prev = n.el;
    }
  }

  function createBox(e) {
    const el = h('div', { class: 'wb-box t-' + e.type, 'data-id': e.id });
    if (e.type === 'text') {
      el.classList.add('v-' + (e.variant || 'card'));
      if (e.color) el.classList.add('c-' + e.color);
      const t = h('div', { class: 'wb-txt' });
      t.innerHTML = richText(e.text);
      el.append(t);
    } else if (e.type === 'picture') {
      const img = h('img', { src: assetURL(e.src), alt: e.caption || '', draggable: 'false' });
      img.addEventListener('error', () => el.classList.add('is-broken'));
      img.addEventListener('load', () => el.classList.remove('is-broken'));
      el.append(h('div', { class: 'wb-pic' }, img, h('span', { class: 'wb-broken-msg', text: 'Picture not found: ' + e.src })));
      if (e.caption) el.append(h('div', { class: 'wb-caption', text: e.caption }));
    } else if (e.type === 'diagram') {
      const head = h('div', { class: 'wb-dhead', title: isView() ? null : 'Drag here to move' }, icon('diagram'), h('span', { text: e.title || 'Diagram' }));
      const frame = h('iframe', { sandbox: 'allow-scripts allow-popups', title: e.title || 'Diagram' });
      if (cfg.mode !== 'dev') frame.srcdoc = diagrams[e.src] || missingDiagram(e.src);
      else frame.src = assetURL(e.src);
      el.append(head, h('div', { class: 'wb-dbody' }, frame));
    }
    if (!isView()) el.append(h('div', { class: 'wb-resize', 'data-handle': 'resize', title: 'Drag to resize' }));
    if (ro) ro.observe(el);
    return el;
  }

  function missingDiagram(src) {
    return '<body style="font:13px system-ui;color:#C23A3A;display:grid;place-items:center;height:90vh;margin:0">Diagram not found: ' + esc(src || '(no src)') + '</body>';
  }

  function placeBox(el, e) {
    el.style.left = e.x + 'px';
    el.style.top = e.y + 'px';
    el.style.width = e.w + 'px';
    if (e.type === 'text') { el.style.height = ''; el.style.minHeight = e.h ? e.h + 'px' : ''; }
    else el.style.height = e.h + 'px';
  }

  function rectOf(e) {
    const n = nodes.get(e.id);
    const w = n ? n.el.offsetWidth : e.w;
    const hh = e.type === 'text' ? (n ? n.el.offsetHeight : (e.h || 40)) : e.h;
    return { x: e.x, y: e.y, w, h: hh };
  }

  function scheduleLinks() {
    if (linkFrame) return;
    linkFrame = requestAnimationFrame(() => { linkFrame = 0; renderLinks(); });
  }

  function anchor(ref) {
    if (ref && typeof ref === 'object') return { pt: { x: +ref.x || 0, y: +ref.y || 0 }, gap: 0 };
    const e = typeof ref === 'string' ? byId(ref) : null;
    if (!e) return null;
    if (e.type === 'brace') {
      const g = braceCache.get(e.id);
      return g ? { pt: g.tip, gap: 6 } : null;
    }
    if (!isBox(e)) return null;
    const r = rectOf(e);
    return { rect: r, pt: { x: r.x + r.w / 2, y: r.y + r.h / 2 } };
  }

  function clipTo(A, toward) {
    let dx = toward.x - A.pt.x, dy = toward.y - A.pt.y;
    const L = Math.hypot(dx, dy) || 1;
    dx /= L; dy /= L;
    let k;
    if (A.rect) {
      const tx = dx ? (A.rect.w / 2) / Math.abs(dx) : Infinity;
      const ty = dy ? (A.rect.h / 2) / Math.abs(dy) : Infinity;
      k = Math.min(tx, ty) + 7;
    } else k = A.gap || 0;
    return { x: A.pt.x + dx * k, y: A.pt.y + dy * k };
  }

  function endRef(e, which) {
    if (gesture && gesture.kind === 'arrowEnd' && gesture.id === e.id && gesture.which === which && gesture.pt) return gesture.pt;
    return e[which];
  }

  function arrowGeom(e) {
    const A = anchor(endRef(e, 'from')), B = anchor(endRef(e, 'to'));
    if (!A || !B) return null;
    const ca = A.pt, cb = B.pt;
    const dx = cb.x - ca.x, dy = cb.y - ca.y;
    const len = Math.hypot(dx, dy) || 1;
    const n = { x: -dy / len, y: dx / len };
    const mid = { x: (ca.x + cb.x) / 2, y: (ca.y + cb.y) / 2 };
    const curve = Number(e.curve) || 0;
    const c = { x: mid.x + n.x * curve, y: mid.y + n.y * curve };
    const st = clipTo(A, curve ? c : cb), en = clipTo(B, curve ? c : ca);
    const cc = curve ? c : { x: (st.x + en.x) / 2, y: (st.y + en.y) / 2 };
    return { s: st, t: en, c: cc, n, mid, curved: !!curve };
  }

  function qpt(G, k) {
    const a = (1 - k) * (1 - k), b = 2 * (1 - k) * k, c = k * k;
    return { x: a * G.s.x + b * G.c.x + c * G.t.x, y: a * G.s.y + b * G.c.y + c * G.t.y };
  }

  function curly(p1, p2, w, q) {
    let dx = p1.x - p2.x, dy = p1.y - p2.y;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    const qx1 = p1.x + q * w * dy, qy1 = p1.y - q * w * dx;
    const qx2 = p1.x - 0.25 * len * dx + (1 - q) * w * dy, qy2 = p1.y - 0.25 * len * dy - (1 - q) * w * dx;
    const tx = p1.x - 0.5 * len * dx + w * dy, ty = p1.y - 0.5 * len * dy - w * dx;
    const qx3 = p2.x + q * w * dy, qy3 = p2.y - q * w * dx;
    const qx4 = p1.x - 0.75 * len * dx + (1 - q) * w * dy, qy4 = p1.y - 0.75 * len * dy - (1 - q) * w * dx;
    const f = (v) => Math.round(v * 10) / 10;
    return {
      d: `M${f(p1.x)},${f(p1.y)} Q${f(qx1)},${f(qy1)} ${f(qx2)},${f(qy2)} T${f(tx)},${f(ty)} M${f(p2.x)},${f(p2.y)} Q${f(qx3)},${f(qy3)} ${f(qx4)},${f(qy4)} T${f(tx)},${f(ty)}`,
      tip: { x: tx, y: ty },
    };
  }

  function braceGeom(e) {
    const rs = e.members.map(byId).filter(isBox).map(rectOf);
    if (!rs.length) return null;
    const x1 = Math.min(...rs.map((r) => r.x)), y1 = Math.min(...rs.map((r) => r.y));
    const x2 = Math.max(...rs.map((r) => r.x + r.w)), y2 = Math.max(...rs.map((r) => r.y + r.h));
    const gap = 12;
    let p1, p2, out;
    if (e.side === 'left') { const x = x1 - gap; p1 = { x, y: y1 }; p2 = { x, y: y2 }; out = { x: -1, y: 0 }; }
    else if (e.side === 'top') { const y = y1 - gap; p1 = { x: x2, y }; p2 = { x: x1, y }; out = { x: 0, y: -1 }; }
    else if (e.side === 'bottom') { const y = y2 + gap; p1 = { x: x1, y }; p2 = { x: x2, y }; out = { x: 0, y: 1 }; }
    else { const x = x2 + gap; p1 = { x, y: y2 }; p2 = { x, y: y1 }; out = { x: 1, y: 0 }; }
    const len = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    const depth = clamp(len * 0.07, 9, 20);
    const c = curly(p1, p2, depth, 0.6);
    return { d: c.d, tip: c.tip, out, p1, p2, depth, bbox: { x1, y1, x2, y2 } };
  }

  function renderLinks() {
    const svg = ui.svg;
    svg.textContent = '';
    ui.overlay.textContent = '';
    braceCache.clear();
    const gB = s('g'), gA = s('g'), gH = s('g');
    for (const e of board.elements) {
      if (e.type !== 'brace') continue;
      const g = braceGeom(e);
      if (!g) continue;
      braceCache.set(e.id, g);
      drawBrace(gB, e, g);
    }
    for (const e of board.elements) {
      if (e.type !== 'arrow') continue;
      const G = arrowGeom(e);
      if (G) drawArrow(gA, e, G);
    }
    if (arrowDraft) drawDraft(gH);
    const one = single();
    if (one && one.type === 'arrow' && !editing) {
      const G = arrowGeom(one);
      if (G) {
        const m = qpt(G, 0.5);
        gH.append(
          s('circle', { cx: G.s.x, cy: G.s.y, r: 6, class: 'wb-handle', 'data-handle': 'from' }),
          s('circle', { cx: G.t.x, cy: G.t.y, r: 6, class: 'wb-handle', 'data-handle': 'to' }),
          s('circle', { cx: m.x, cy: m.y, r: 4.5, class: 'wb-handle mid', 'data-handle': 'mid' }));
      }
    }
    svg.append(gB, gA);
    ui.overlay.append(gH);
  }

  function drawBrace(g, e, G) {
    const grp = s('g', { class: 'wb-brace' + (selected.has(e.id) ? ' is-selected' : ''), 'data-link': e.id });
    grp.append(s('path', { d: G.d, class: 'wb-brace-path' }), s('path', { d: G.d, class: 'wb-hit' }));
    if (e.label) {
      const o = G.out, off = 10;
      const attrs = { x: G.tip.x + o.x * off, y: G.tip.y + o.y * off, class: 'wb-brace-label' };
      if (o.x > 0) Object.assign(attrs, { 'text-anchor': 'start', 'dominant-baseline': 'central' });
      else if (o.x < 0) Object.assign(attrs, { 'text-anchor': 'end', 'dominant-baseline': 'central' });
      else if (o.y < 0) Object.assign(attrs, { 'text-anchor': 'middle', 'dominant-baseline': 'auto' });
      else Object.assign(attrs, { 'text-anchor': 'middle', 'dominant-baseline': 'hanging' });
      const t = s('text', attrs);
      t.textContent = e.label;
      grp.append(t);
    }
    g.append(grp);
  }

  function drawArrow(g, e, G) {
    const { s: st, t, c } = G;
    let ux = t.x - c.x, uy = t.y - c.y;
    const L = Math.hypot(ux, uy) || 1;
    ux /= L; uy /= L;
    const nx = -uy, ny = ux;
    const eq = e.style === 'equivalence';
    const back = eq ? 5 : (board.theme === 'minimal' ? 1 : 9);
    const te = { x: t.x - ux * back, y: t.y - uy * back };
    const f = (v) => Math.round(v * 10) / 10;
    const body = G.curved ? `M${f(st.x)},${f(st.y)} Q${f(c.x)},${f(c.y)} ${f(te.x)},${f(te.y)}` : `M${f(st.x)},${f(st.y)} L${f(te.x)},${f(te.y)}`;
    const full = G.curved ? `M${f(st.x)},${f(st.y)} Q${f(c.x)},${f(c.y)} ${f(t.x)},${f(t.y)}` : `M${f(st.x)},${f(st.y)} L${f(t.x)},${f(t.y)}`;
    const grp = s('g', { class: 'wb-arrow' + (selected.has(e.id) ? ' is-selected' : ''), 'data-link': e.id });
    if (eq) {
      const hw = 8.5, hl = 12;
      grp.append(
        s('path', { d: body, class: 'wb-stroke-outer' }),
        s('path', { d: body, class: 'wb-stroke-inner' }),
        s('path', { class: 'wb-head-open', d: `M${f(t.x - ux * hl + nx * hw)},${f(t.y - uy * hl + ny * hw)} L${f(t.x)},${f(t.y)} L${f(t.x - ux * hl - nx * hw)},${f(t.y - uy * hl - ny * hw)}` }));
    } else {
      const hw = 5.5, hl = 11;
      grp.append(
        s('path', { d: body, class: 'wb-stroke' }),
        s('path', { class: 'wb-head', d: `M${f(t.x - ux * hl + nx * hw)},${f(t.y - uy * hl + ny * hw)} L${f(t.x)},${f(t.y)} L${f(t.x - ux * hl - nx * hw)},${f(t.y - uy * hl - ny * hw)}` }));
    }
    grp.append(s('path', { d: full, class: 'wb-hit' }));
    if (e.label) {
      // Put the label beside the line: above a mostly-horizontal arrow, right of a mostly-vertical one,
      // or on the outside of the bend for a curved arrow.
      const m = qpt(G, 0.5);
      let ox = G.n.x, oy = G.n.y;
      if (G.curved) { const sg = Math.sign(Number(e.curve)) || 1; ox *= sg; oy *= sg; }
      else if (Math.abs(oy) >= Math.abs(ox)) { if (oy > 0) { ox = -ox; oy = -oy; } }
      else if (ox < 0) { ox = -ox; oy = -oy; }
      const vertical = Math.abs(ox) > Math.abs(oy);
      const d = 9;
      const tx = s('text', {
        x: m.x + ox * d, y: m.y + oy * d, class: 'wb-link-label',
        'text-anchor': vertical ? (ox > 0 ? 'start' : 'end') : 'middle',
        'dominant-baseline': vertical ? 'central' : (oy < 0 ? 'auto' : 'hanging'),
      });
      tx.textContent = e.label;
      grp.append(tx);
    }
    g.append(grp);
  }

  function drawDraft(g) {
    const A = anchor(arrowDraft.from);
    if (!A) return;
    const target = arrowDraft.hover ? anchor(arrowDraft.hover) : null;
    const endPt = target ? clipTo(target, A.pt) : arrowDraft.pt;
    const st = clipTo(A, target ? target.pt : arrowDraft.pt);
    g.append(s('path', { d: `M${st.x},${st.y} L${endPt.x},${endPt.y}`, class: 'wb-draft' }), s('circle', { cx: endPt.x, cy: endPt.y, r: 4, class: 'wb-draft-dot' }));
  }

  function renderStatus() {
    let text, state = saveState;
    if (cfg.mode !== 'dev') {
      text = saveState === 'unsaved' ? 'Unsaved changes. Use Save copy to keep them.' : (saveState === 'savedCopy' ? 'Copy saved' : 'Standalone copy');
      state = saveState === 'unsaved' ? 'dirty' : 'saved';
    } else {
      text = { saved: 'Saved to board.json', saving: 'Saving…', dirty: 'Saving…', offline: 'Can’t reach the local server. Changes stay in this tab until it’s back.', error: saveMessage || 'Save failed' }[saveState] || '';
    }
    ui.status.textContent = text;
    ui.status.dataset.state = state;
  }

  function applyView() {
    ui.world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
    const g = GRID * view.z, G5 = g * 5;
    ui.stage.style.backgroundSize = `${G5}px ${G5}px, ${G5}px ${G5}px, ${g}px ${g}px, ${g}px ${g}px`;
    ui.stage.style.backgroundPosition = `${view.x}px ${view.y}px`;
    ui.stage.classList.toggle('is-zoomed-out', g < 9);
    clearTimeout(viewTimer);
    viewTimer = setTimeout(() => storage('wb-view:' + (cfg.board || board.title), JSON.stringify(view)), 300);
  }

  function bounds() {
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    const add = (x, y) => { x1 = Math.min(x1, x); y1 = Math.min(y1, y); x2 = Math.max(x2, x); y2 = Math.max(y2, y); };
    for (const e of board.elements) if (isBox(e)) { const r = rectOf(e); add(r.x, r.y); add(r.x + r.w, r.y + r.h); }
    for (const [id, g] of braceCache) { add(g.tip.x + g.out.x * 60, g.tip.y + g.out.y * 24); add(g.p1.x, g.p1.y); }
    for (const e of board.elements) if (e.type === 'arrow') { const G = arrowGeom(e); if (G) { add(G.s.x, G.s.y); add(G.t.x, G.t.y); const m = qpt(G, 0.5); add(m.x, m.y); } }
    return { x1, y1, x2, y2 };
  }

  function fit() {
    const b = bounds();
    const r = ui.stage.getBoundingClientRect();
    if (!isFinite(b.x1)) { view.x = 40; view.y = 60; view.z = 1; applyView(); return; }
    const top = 56, bottom = 80, side = 40;
    const z = clamp(Math.min((r.width - 2 * side) / Math.max(1, b.x2 - b.x1), (r.height - top - bottom) / Math.max(1, b.y2 - b.y1)), 0.15, 1.25);
    view.z = z;
    view.x = (r.width - (b.x2 - b.x1) * z) / 2 - b.x1 * z;
    view.y = top + (r.height - top - bottom - (b.y2 - b.y1) * z) / 2 - b.y1 * z;
    applyView();
  }
  WB.fit = () => { renderLinks(); fit(); };

  function zoomAt(cx, cy, z) {
    z = clamp(z, 0.15, 3);
    const r = ui.stage.getBoundingClientRect();
    const px = cx - r.left, py = cy - r.top;
    const wx = (px - view.x) / view.z, wy = (py - view.y) / view.z;
    view.z = z;
    view.x = px - wx * z;
    view.y = py - wy * z;
    applyView();
  }
  function zoomCenter(z) { const r = ui.stage.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, z); }

  function toWorld(cx, cy) {
    const r = ui.stage.getBoundingClientRect();
    return { x: (cx - r.left - view.x) / view.z, y: (cy - r.top - view.y) / view.z };
  }
  function toScreen(p) {
    const r = ui.stage.getBoundingClientRect();
    return { x: r.left + view.x + p.x * view.z, y: r.top + view.y + p.y * view.z };
  }
  function centerPoint() { const r = ui.stage.getBoundingClientRect(); return toWorld(r.left + r.width / 2 - 100, r.top + r.height / 2 - 60); }

  function toast(msg, ms = 2600) {
    ui.toast.textContent = msg;
    ui.toast.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => ui.toast.classList.remove('is-on'), ms);
  }

  /* ---------------- changes, undo, saving ---------------- */
  function snapshot() { return JSON.stringify(board); }
  function pushUndo(snap) {
    undoStack.push(snap || snapshot());
    if (undoStack.length > 200) undoStack.shift();
    redoStack = [];
  }
  function mutate(fn) { pushUndo(); fn(); afterChange(); }
  function afterChange() { render(); markDirty(); }
  function pruneSelection() { selected = new Set([...selected].filter((id) => byId(id))); }

  function undo() {
    if (editing) finishEdit();
    if (!undoStack.length) return;
    redoStack.push(snapshot());
    board = normalize(JSON.parse(undoStack.pop()));
    pruneSelection();
    afterChange();
  }
  function redo() {
    if (!redoStack.length) return;
    undoStack.push(snapshot());
    board = normalize(JSON.parse(redoStack.pop()));
    pruneSelection();
    afterChange();
  }

  function markDirty() {
    if (isView()) return;
    if (cfg.mode === 'standalone') { saveState = 'unsaved'; renderStatus(); return; }
    saveState = 'dirty';
    renderStatus();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { saveTimer = null; saveNow(); }, 350);
  }

  async function saveNow() {
    if (cfg.mode !== 'dev') return saveCopy();
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    if (saving) { saveQueued = true; return; }
    saving = true;
    saveState = 'saving';
    renderStatus();
    try {
      const r = await fetch('/api/board/' + enc(cfg.board), {
        method: 'PUT', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ baseRev: rev, board }),
      });
      if (r.status === 409) {
        const j = await r.json();
        pushUndo();
        board = normalize(j.board); rev = j.rev;
        pruneSelection();
        render();
        toast('board.json changed on disk at the same moment, so that version is loaded. Your last change is one Undo away.', 6000);
        saveState = 'saved';
      } else if (r.ok) {
        rev = (await r.json()).rev;
        saveState = 'saved';
      } else {
        saveState = 'error';
        saveMessage = 'Save failed: ' + (await r.text());
      }
    } catch (err) {
      saveState = 'offline';
      setTimeout(() => { if (saveState === 'offline') saveNow(); }, 2500);
    }
    saving = false;
    renderStatus();
    if (saveQueued) { saveQueued = false; saveNow(); }
    if (pendingRemote && !gesture && !editing) applyRemote();
  }

  function usedAssets() {
    const out = {};
    for (const e of board.elements) if (e.type === 'picture' && assets[e.src]) out[e.src] = assets[e.src];
    return out;
  }

  async function saveCopy() {
    if (isView()) return;
    if (editing) finishEdit();
    const data = { board, assets: usedAssets(), diagrams, savedAt: new Date().toISOString() };
    const json = JSON.stringify(data).replace(/</g, '\\u003c');
    const marker = '<script id="wb-data" type="application/json">';
    const i = pristine.indexOf(marker);
    const j = pristine.indexOf('</' + 'script>', i);
    if (i < 0 || j < 0) { toast('Could not build the copy: this file is missing its data block.'); return; }
    const html = pristine.slice(0, i + marker.length) + json + pristine.slice(j);
    let name = decodeURIComponent((location.pathname.split('/').pop() || '').trim());
    if (!/\.html?$/i.test(name)) name = (board.title || 'whiteboard').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.html';
    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'HTML file', accept: { 'text/html': ['.html'] } }] });
        const w = await handle.createWritable();
        await w.write(html);
        await w.close();
        saveState = 'savedCopy'; renderStatus(); toast('Copy saved');
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
    }
    const a = h('a', { href: URL.createObjectURL(new Blob([html], { type: 'text/html' })), download: name });
    document.body.append(a); a.click(); a.remove();
    saveState = 'savedCopy'; renderStatus(); toast('Copy downloaded as ' + name);
  }

  async function exportHTML() {
    await saveNow();
    try {
      const r = await fetch('/api/export/' + enc(cfg.board), { method: 'POST' });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'export failed');
      toast('Exported ' + j.file + (j.missing && j.missing.length ? ' (missing: ' + j.missing.join(', ') + ')' : ''), 5000);
    } catch (err) { toast('Export failed: ' + err.message, 5000); }
  }

  /* ---------------- live sync (dev) ---------------- */
  function connectEvents() {
    const es = new EventSource('/events?board=' + enc(cfg.board));
    es.onmessage = (m) => {
      let msg;
      try { msg = JSON.parse(m.data); } catch (e) { return; }
      if (msg.type === 'board' && msg.rev > rev) { pendingRemote = true; if (!editing && !gesture && !saving && !saveTimer) applyRemote(); }
      else if (msg.type === 'diagram') reloadDiagram(msg.src);
      else if (msg.type === 'asset') reloadAsset(msg.src);
      else if (msg.type === 'engine') location.reload();
      else if (msg.type === 'error') toast(msg.message, 7000);
    };
    es.onerror = () => { if (saveState === 'saved') { saveState = 'offline'; renderStatus(); } };
    es.onopen = () => { if (saveState === 'offline') { saveState = 'saved'; renderStatus(); pendingRemote = true; applyRemote(); } };
  }

  async function applyRemote() {
    pendingRemote = false;
    try {
      const r = await fetch('/api/board/' + enc(cfg.board));
      const j = await r.json();
      if (j.rev <= rev) return;
      if (editing || gesture) { pendingRemote = true; return; }
      pushUndo();
      board = normalize(j.board);
      rev = j.rev;
      pruneSelection();
      render();
      toast('Updated from board.json', 1400);
    } catch (e) { /* will retry on next event */ }
  }

  function reloadDiagram(src) {
    bust[src] = Date.now();
    for (const e of board.elements) {
      if (e.type !== 'diagram' || e.src !== src) continue;
      const n = nodes.get(e.id);
      const f = n && n.el.querySelector('iframe');
      if (f && cfg.mode === 'dev') f.src = assetURL(src);
    }
  }
  function reloadAsset(src) {
    bust[src] = Date.now();
    for (const e of board.elements) {
      if (e.type !== 'picture' || e.src !== src) continue;
      const n = nodes.get(e.id);
      const img = n && n.el.querySelector('img');
      if (img) img.src = assetURL(src);
    }
  }

  /* ---------------- element operations ---------------- */
  function removeElements(ids) {
    const set = new Set(ids);
    for (const e of board.elements) {
      if (set.has(e.id)) continue;
      if (e.type === 'arrow') {
        for (const w of ['from', 'to']) {
          if (typeof e[w] === 'string' && set.has(e[w])) {
            const G = arrowGeom(e);
            const p = G ? (w === 'from' ? G.s : G.t) : { x: 0, y: 0 };
            e[w] = { x: Math.round(p.x), y: Math.round(p.y) };
          }
        }
      }
      if (e.type === 'brace') e.members = e.members.filter((m) => !set.has(m));
    }
    board.elements = board.elements.filter((e) => !set.has(e.id) && !(e.type === 'brace' && !e.members.length));
    pruneSelection();
  }

  function deleteSelection() {
    if (!selected.size) return;
    pushUndo();
    removeElements([...selected]);
    selected.clear();
    afterChange();
  }

  function duplicate() {
    const boxes = [...selected].map(byId).filter(isBox);
    if (!boxes.length) return;
    pushUndo();
    const fresh = [];
    for (const e of boxes) {
      const c = JSON.parse(JSON.stringify(e));
      c.id = uid(e.type[0]);
      c.x += GRID; c.y += GRID;
      board.elements.push(c);
      fresh.push(c.id);
    }
    selected = new Set(fresh);
    afterChange();
  }

  function braceFromSelection() {
    const sel = [...selected].map(byId).filter(Boolean);
    const boxes = sel.filter(isBox).map((e) => e.id);
    const braces = sel.filter((e) => e.type === 'brace');
    if (!boxes.length) { toast('Select the boxes to group first. Shift-click to pick several.'); return; }
    pushUndo();
    if (braces.length === 1) {
      braces[0].members = boxes;
      selected = new Set([braces[0].id]);
    } else {
      const b = { id: uid('b'), type: 'brace', members: boxes, side: 'right' };
      board.elements.push(b);
      selected = new Set([b.id]);
    }
    afterChange();
  }

  function toggleStyleOrSide() {
    const sel = [...selected].map(byId).filter(Boolean);
    if (sel.length && sel.every((e) => e.type === 'arrow')) {
      const next = sel[0].style === 'sequence' ? 'equivalence' : 'sequence';
      mutate(() => sel.forEach((e) => { e.style = next; }));
    } else if (sel.length === 1 && sel[0].type === 'brace') {
      const b = sel[0];
      mutate(() => { b.side = SIDES[(SIDES.indexOf(b.side) + 1) % SIDES.length]; });
    } else if (tool === 'arrow') {
      draftStyle = draftStyle === 'sequence' ? 'equivalence' : 'sequence';
      renderTray();
    }
  }

  function addText(p, text) {
    pushUndo();
    const e = { id: uid('t'), type: 'text', x: snap(p.x), y: snap(p.y), w: 220, variant: 'card', text: text || '' };
    board.elements.push(e);
    selected = new Set([e.id]);
    render();
    return e;
  }

  function readAsDataURL(file) {
    return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  }
  function imageSize(url) {
    return new Promise((res) => { const i = new Image(); i.onload = () => res({ w: i.naturalWidth, h: i.naturalHeight }); i.onerror = () => res({ w: 320, h: 240 }); i.src = url; });
  }

  async function addImageFiles(files, p) {
    files = files.filter((f) => f && f.type && f.type.startsWith('image/'));
    if (!files.length) return;
    const before = snapshot();
    let x = snap(p.x), y = snap(p.y);
    const added = [];
    for (const f of files) {
      const dataURL = await readAsDataURL(f);
      const dim = await imageSize(dataURL);
      let src;
      const name = (f.name && f.name !== 'image.png' ? f.name : 'pasted-' + Date.now().toString(36) + '.' + (f.type.split('/')[1] || 'png').replace('svg+xml', 'svg'));
      if (cfg.mode === 'dev') {
        try {
          const r = await fetch('/api/asset/' + enc(cfg.board) + '/' + enc(name), { method: 'PUT', body: f });
          if (!r.ok) throw new Error(await r.text());
          src = (await r.json()).src;
        } catch (err) { toast('Could not save the picture: ' + err.message, 5000); continue; }
      } else {
        let n = 'assets/' + name.replace(/[^\w.-]+/g, '-'), k = 2;
        while (assets[n]) n = 'assets/' + (k++) + '-' + name.replace(/[^\w.-]+/g, '-');
        src = n;
        assets[src] = dataURL;
      }
      const w = snap(Math.min(320, dim.w || 320));
      const hgt = snap(w * (dim.h || 240) / (dim.w || 320)) + 12;
      const e = { id: uid('p'), type: 'picture', x, y, w: w + 12, h: hgt, src };
      board.elements.push(e);
      added.push(e.id);
      x += w + 52;
    }
    if (!added.length) return;
    pushUndo(before);
    selected = new Set(added);
    afterChange();
  }

  /* ---------------- text editing ---------------- */
  function startEdit(id, isNew) {
    const e = byId(id), n = nodes.get(id);
    if (!e || !n || e.type !== 'text') return;
    if (editing) finishEdit();
    editing = id;
    editIsNew = !!isNew;
    editSnapshot = isNew ? null : snapshot();
    const t = n.el.querySelector('.wb-txt');
    t.textContent = e.text;
    try { t.contentEditable = 'plaintext-only'; } catch (err) { /* older browsers */ }
    if (t.contentEditable !== 'plaintext-only') t.contentEditable = 'true';
    n.el.classList.add('is-editing');
    t.focus();
    const range = document.createRange();
    range.selectNodeContents(t);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    t.oninput = () => scheduleLinks();
    renderLinks();
  }

  function finishEdit() {
    const id = editing;
    if (!id) return;
    editing = null;
    const e = byId(id), n = nodes.get(id);
    const t = n && n.el.querySelector('.wb-txt');
    let text = e ? e.text : '';
    if (t) {
      text = t.innerText.replace(/ /g, ' ').replace(/\n+$/, '');
      t.contentEditable = 'false';
      t.removeAttribute('contenteditable');
      t.oninput = null;
      n.el.classList.remove('is-editing');
    }
    if (!e) return;
    if (!text.trim()) {
      if (editIsNew) { removeElements([id]); undoStack.pop(); render(); }
      else { pushUndo(editSnapshot); removeElements([id]); afterChange(); }
    } else if (text !== e.text || editIsNew) {
      if (!editIsNew) pushUndo(editSnapshot);
      e.text = text;
      n.sig = null;
      afterChange();
    } else {
      t.innerHTML = richText(e.text);
      render();
    }
    if (pendingRemote) applyRemote();
  }

  function editLabel(e) {
    if (!e) return;
    const field = e.type === 'picture' ? 'caption' : e.type === 'diagram' ? 'title' : e.type === 'text' ? null : 'label';
    if (!field) { startEdit(e.id); return; }
    let p;
    if (e.type === 'arrow') { const G = arrowGeom(e); if (!G) return; p = qpt(G, 0.5); }
    else if (e.type === 'brace') { const g = braceCache.get(e.id); if (!g) return; p = { x: g.tip.x + g.out.x * 60, y: g.tip.y + g.out.y * 24 }; }
    else if (e.type === 'diagram') p = { x: e.x + e.w / 2, y: e.y + 14 };
    else p = { x: e.x + e.w / 2, y: e.y + e.h - 12 };
    const sp = toScreen(p);
    ui.editor.style.left = clamp(sp.x, 120, window.innerWidth - 120) + 'px';
    ui.editor.style.top = clamp(sp.y, 30, window.innerHeight - 90) + 'px';
    ui.editor.hidden = false;
    ui.editorInput.value = e[field] || '';
    ui.editorInput.placeholder = { label: 'Label', caption: 'Caption', title: 'Diagram title' }[field];
    labelCtx = { id: e.id, field };
    ui.editorInput.focus();
    ui.editorInput.select();
  }

  function closeLabel(commit) {
    if (!labelCtx) return;
    const { id, field } = labelCtx;
    labelCtx = null;
    ui.editor.hidden = true;
    const e = byId(id);
    if (!commit || !e) return;
    const v = ui.editorInput.value.trim();
    if (v === (e[field] || '')) return;
    mutate(() => { if (v) e[field] = v; else delete e[field]; });
  }

  /* ---------------- pointer interaction ---------------- */
  function targetAt(cx, cy, excludeId) {
    for (const el of document.elementsFromPoint(cx, cy)) {
      if (el.closest('[data-handle]')) continue;
      const b = el.closest('.wb-box');
      if (b && b.dataset.id !== excludeId) return b.dataset.id;
      const l = el.closest('[data-link]');
      if (l) { const e = byId(l.dataset.link); if (e && e.type === 'brace' && e.id !== excludeId) return e.id; }
      if (el === ui.stage) break;
    }
    return null;
  }

  function setDrop(id) {
    for (const [nid, n] of nodes) n.el.classList.toggle('is-drop', nid === id);
  }

  function onPointerDown(ev) {
    if (ev.pointerType === 'touch') {
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      capture(ev);
      if (pointers.size >= 2) { ev.preventDefault(); if (!gesture || gesture.kind !== 'pinch') startPinch(); return; }
      touchStart = null;
    }
    if (isView()) {
      // View mode: left or middle drag anywhere pans; nothing can be selected or moved.
      if (ev.button === 0 || ev.button === 1) { ev.preventDefault(); startPan(ev, false); }
      return;
    }
    if (ev.target.closest('.wb-label-editor')) return;
    if (labelCtx) closeLabel(true);
    if (!ui.help.hidden && !ev.target.closest('.wb-help')) toggleHelp(false);
    const p = toWorld(ev.clientX, ev.clientY);
    if (ev.button === 1 || (ev.button === 0 && spaceDown)) { ev.preventDefault(); startPan(ev, false); return; }
    if (ev.button !== 0) return;
    const boxEl = ev.target.closest('.wb-box');
    if (editing) {
      if (boxEl && boxEl.dataset.id === editing && !ev.target.closest('[data-handle]')) return;
      finishEdit();
    }
    if (ev.pointerType === 'touch') {
      touchStart = { board: snapshot(), undoLen: undoStack.length, redo: redoStack.slice(), selected: new Set(selected), tool };
    }
    if (tool === 'text') {
      if (boxEl) { setTool('select'); } else {
        ev.preventDefault();
        const e = addText(p);
        setTool('select');
        requestAnimationFrame(() => startEdit(e.id, true));
        return;
      }
    }
    if (tool === 'arrow') { ev.preventDefault(); arrowDown(ev, p); return; }
    const handle = ev.target.closest('[data-handle]');
    if (handle) { ev.preventDefault(); startHandle(ev, p, handle); return; }
    if (boxEl) {
      const id = boxEl.dataset.id;
      if (ev.shiftKey) { if (selected.has(id)) selected.delete(id); else selected.add(id); }
      else if (!selected.has(id)) selected = new Set([id]);
      render();
      startMove(ev, p, id);
      return;
    }
    const linkEl = ev.target.closest('[data-link]');
    if (linkEl) {
      ev.preventDefault();
      const id = linkEl.dataset.link;
      if (ev.shiftKey) { if (selected.has(id)) selected.delete(id); else selected.add(id); }
      else selected = new Set([id]);
      render();
      if (byId(id) && byId(id).type === 'brace') startMove(ev, p, id);
      return;
    }
    if (ev.shiftKey) startMarquee(ev, p); else startPan(ev, true);
  }

  function capture(ev) { try { ui.stage.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ } }

  function startPan(ev, clearOnClick) {
    gesture = { kind: 'pan', sx: ev.clientX, sy: ev.clientY, vx: view.x, vy: view.y, moved: false, clearOnClick };
    ui.stage.classList.add('is-panning');
    capture(ev);
  }

  /* Two-finger pinch (touch): zoom around the fingers and pan with them. Never edits the board. */
  function startPinch() {
    // Cancel whatever the first finger started, changing nothing.
    if (arrowDraft) arrowDraft = null;
    if (gesture && gesture.kind === 'marquee') ui.marquee.hidden = true;
    setDrop(null);
    if (touchStart) {
      if (editing) abortEdit();
      if (snapshot() !== touchStart.board) board = normalize(JSON.parse(touchStart.board));
      undoStack.length = Math.min(undoStack.length, touchStart.undoLen);
      redoStack = touchStart.redo;
      selected = touchStart.selected;
      if (tool !== touchStart.tool) setTool(touchStart.tool);
      touchStart = null;
      render();
    }
    ui.stage.classList.remove('is-dragging', 'is-linking');
    ui.stage.classList.add('is-panning');
    pinchFromPointers();
  }

  function pinchFromPointers() {
    const [[ia, a], [ib, b]] = [...pointers].slice(0, 2);
    const r = ui.stage.getBoundingClientRect();
    const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
    gesture = { kind: 'pinch', ids: [ia, ib], d0: Math.hypot(b.x - a.x, b.y - a.y) || 1, z0: view.z, wx: (mx - view.x) / view.z, wy: (my - view.y) / view.z };
  }

  function updatePinch() {
    const g = gesture, a = pointers.get(g.ids[0]), b = pointers.get(g.ids[1]);
    if (!a || !b) return;
    const r = ui.stage.getBoundingClientRect();
    const z = clamp(g.z0 * Math.hypot(b.x - a.x, b.y - a.y) / g.d0, 0.15, 3);
    // keep the world point that was under the starting midpoint under the current midpoint
    view.z = z;
    view.x = (a.x + b.x) / 2 - r.left - g.wx * z;
    view.y = (a.y + b.y) / 2 - r.top - g.wy * z;
    applyView();
  }

  // Drop a text edit the cancelled touch started, without saving it.
  function abortEdit() {
    const n = nodes.get(editing);
    editing = null;
    editIsNew = false;
    if (n) {
      const t = n.el.querySelector('.wb-txt');
      if (t) { t.removeAttribute('contenteditable'); t.oninput = null; t.blur(); }
      n.el.classList.remove('is-editing');
      n.sig = null;
    }
  }

  function startMarquee(ev, p) {
    gesture = { kind: 'marquee', sx: ev.clientX, sy: ev.clientY, p0: p, base: new Set(selected) };
    capture(ev);
  }

  function startMove(ev, p, clickedId) {
    const ids = new Set();
    for (const id of selected) {
      const e = byId(id);
      if (isBox(e)) ids.add(id);
      else if (e && e.type === 'brace') e.members.forEach((m) => ids.add(m));
    }
    const orig = new Map([...ids].map((id) => { const e = byId(id); return [id, { x: e.x, y: e.y }]; }).filter(([id]) => byId(id)));
    gesture = { kind: 'move', sx: ev.clientX, sy: ev.clientY, p0: p, orig, before: snapshot(), moved: false, clickedId, shift: ev.shiftKey };
    capture(ev);
  }

  function startHandle(ev, p, handle) {
    const kind = handle.dataset.handle;
    if (kind === 'resize') {
      const id = handle.closest('.wb-box').dataset.id;
      const e = byId(id);
      const r = rectOf(e);
      gesture = { kind: 'resize', id, p0: p, w: e.w, h: r.h, before: snapshot(), moved: false };
    } else {
      const e = single();
      if (!e || e.type !== 'arrow') return;
      gesture = { kind: kind === 'mid' ? 'curve' : 'arrowEnd', id: e.id, which: kind, p0: p, pt: null, before: snapshot(), moved: false };
      ui.stage.classList.add('is-linking');
    }
    ui.stage.classList.add('is-dragging');
    capture(ev);
  }

  function arrowDown(ev, p) {
    const tgt = targetAt(ev.clientX, ev.clientY);
    if (!arrowDraft) {
      arrowDraft = { from: tgt || { x: snap(p.x), y: snap(p.y) }, pt: p, hover: null, sx: ev.clientX, sy: ev.clientY };
      gesture = { kind: 'arrowDraft' };
      ui.stage.classList.add('is-linking');
      capture(ev);
      renderLinks();
      return;
    }
    finishArrow(tgt, p);
  }

  function finishArrow(tgt, p) {
    const from = arrowDraft.from;
    arrowDraft = null;
    ui.stage.classList.remove('is-linking');
    setDrop(null);
    const to = tgt || { x: snap(p.x), y: snap(p.y) };
    if (typeof from === 'string' && from === to) { renderLinks(); return; }
    pushUndo();
    const a = { id: uid('a'), type: 'arrow', from, to, style: draftStyle };
    board.elements.push(a);
    selected = new Set([a.id]);
    tool = 'select';
    ui.stage.classList.remove('tool-arrow');
    afterChange();
  }

  function onPointerMove(ev) {
    if (pointers.has(ev.pointerId)) pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (gesture && gesture.kind === 'pinch') { updatePinch(); return; }
    const p = toWorld(ev.clientX, ev.clientY);
    if (arrowDraft) {
      arrowDraft.pt = p;
      const hov = targetAt(ev.clientX, ev.clientY, typeof arrowDraft.from === 'string' ? arrowDraft.from : null);
      arrowDraft.hover = hov;
      setDrop(hov);
      scheduleLinks();
    }
    if (!gesture) return;
    const g = gesture;
    if (g.kind === 'pan') {
      const dx = ev.clientX - g.sx, dy = ev.clientY - g.sy;
      if (Math.abs(dx) + Math.abs(dy) > 3) g.moved = true;
      view.x = g.vx + dx; view.y = g.vy + dy;
      applyView();
    } else if (g.kind === 'marquee') {
      const x = Math.min(g.sx, ev.clientX), y = Math.min(g.sy, ev.clientY);
      const r = ui.stage.getBoundingClientRect();
      Object.assign(ui.marquee.style, { left: x - r.left + 'px', top: y - r.top + 'px', width: Math.abs(ev.clientX - g.sx) + 'px', height: Math.abs(ev.clientY - g.sy) + 'px' });
      ui.marquee.hidden = false;
      const a = g.p0, x1 = Math.min(a.x, p.x), y1 = Math.min(a.y, p.y), x2 = Math.max(a.x, p.x), y2 = Math.max(a.y, p.y);
      const next = new Set(g.base);
      for (const e of board.elements) {
        if (!isBox(e)) continue;
        const rr = rectOf(e);
        if (rr.x < x2 && rr.x + rr.w > x1 && rr.y < y2 && rr.y + rr.h > y1) next.add(e.id);
      }
      selected = next;
      renderBoxes();
    } else if (g.kind === 'move') {
      if (!g.moved && Math.abs(ev.clientX - g.sx) + Math.abs(ev.clientY - g.sy) < 4) return;
      if (!g.moved) { g.moved = true; ui.stage.classList.add('is-dragging'); }
      const dx = p.x - g.p0.x, dy = p.y - g.p0.y;
      for (const [id, o] of g.orig) {
        const e = byId(id);
        if (!e) continue;
        e.x = ev.altKey ? Math.round(o.x + dx) : snap(o.x + dx);
        e.y = ev.altKey ? Math.round(o.y + dy) : snap(o.y + dy);
        const n = nodes.get(id);
        if (n) placeBox(n.el, e);
      }
      scheduleLinks();
    } else if (g.kind === 'resize') {
      g.moved = true;
      const e = byId(g.id);
      const dx = p.x - g.p0.x, dy = p.y - g.p0.y;
      e.w = Math.max(60, ev.altKey ? Math.round(g.w + dx) : snap(g.w + dx));
      if (e.type !== 'text') e.h = Math.max(60, ev.altKey ? Math.round(g.h + dy) : snap(g.h + dy));
      placeBox(nodes.get(g.id).el, e);
      scheduleLinks();
    } else if (g.kind === 'arrowEnd') {
      g.moved = true;
      g.pt = p;
      const e = byId(g.id);
      const other = e[g.which === 'from' ? 'to' : 'from'];
      const hov = targetAt(ev.clientX, ev.clientY, typeof other === 'string' ? other : null);
      g.hover = hov;
      setDrop(hov);
      scheduleLinks();
    } else if (g.kind === 'curve') {
      g.moved = true;
      const e = byId(g.id);
      const saved = e.curve;
      e.curve = 0;
      const G = arrowGeom(e);
      e.curve = saved;
      if (!G) return;
      let c = 2 * ((p.x - G.mid.x) * G.n.x + (p.y - G.mid.y) * G.n.y);
      if (Math.abs(c) < 12) c = 0;
      e.curve = Math.round(c);
      if (!e.curve) delete e.curve;
      scheduleLinks();
    }
  }

  function onPointerUp(ev) {
    if (ev.pointerType === 'touch') {
      pointers.delete(ev.pointerId);
      if (gesture && gesture.kind === 'pinch') {
        // One finger lifted: keep panning with the other. Both lifted: done.
        if (pointers.size >= 2) pinchFromPointers();
        else if (pointers.size === 1) { const [q] = pointers.values(); gesture = { kind: 'pan', sx: q.x, sy: q.y, vx: view.x, vy: view.y, moved: true, clearOnClick: false }; }
        else { gesture = null; ui.stage.classList.remove('is-panning'); }
        lastPinchEnd = Date.now();
        if (!gesture && pendingRemote && !editing) applyRemote();
        return;
      }
    }
    const g = gesture;
    if (!g) return;
    gesture = null;
    ui.stage.classList.remove('is-panning', 'is-dragging');
    if (g.kind === 'arrowDraft') {
      if (arrowDraft && Math.abs(ev.clientX - arrowDraft.sx) + Math.abs(ev.clientY - arrowDraft.sy) > 8) {
        finishArrow(targetAt(ev.clientX, ev.clientY, typeof arrowDraft.from === 'string' ? arrowDraft.from : null), toWorld(ev.clientX, ev.clientY));
      }
      return; // otherwise wait for a second click
    }
    ui.stage.classList.remove('is-linking');
    if (g.kind === 'pan') {
      if (!g.moved && g.clearOnClick && selected.size) { selected.clear(); render(); }
    } else if (g.kind === 'marquee') {
      ui.marquee.hidden = true;
      render();
    } else if (g.kind === 'move') {
      if (g.moved) { pushUndo(g.before); afterChange(); }
      else if (!g.shift && g.clickedId && selected.size > 1 && isBox(byId(g.clickedId))) { selected = new Set([g.clickedId]); render(); }
    } else if (g.kind === 'resize') {
      if (g.moved) { pushUndo(g.before); afterChange(); }
    } else if (g.kind === 'arrowEnd') {
      setDrop(null);
      if (g.moved && g.pt) {
        const e = byId(g.id);
        e[g.which] = g.hover || { x: snap(g.pt.x), y: snap(g.pt.y) };
        pushUndo(g.before);
        afterChange();
      } else renderLinks();
    } else if (g.kind === 'curve') {
      if (g.moved) { pushUndo(g.before); afterChange(); }
    }
    if (pendingRemote && !editing) applyRemote();
  }

  function onDblClick(ev) {
    if (isView() || tool !== 'select') return;
    if (pointers.size || Date.now() - lastPinchEnd < 600) return;   // a pinch is never a double-click
    // pointer capture makes ev.target the stage, so look at what is actually under the pointer
    const hit = document.elementFromPoint(ev.clientX, ev.clientY) || ev.target;
    if (!ui.stage.contains(hit)) return;
    const boxEl = hit.closest('.wb-box');
    if (boxEl) {
      const e = byId(boxEl.dataset.id);
      if (!e) return;
      if (e.type === 'text') startEdit(e.id); else editLabel(e);
      return;
    }
    const linkEl = hit.closest('[data-link]');
    if (linkEl) { editLabel(byId(linkEl.dataset.link)); return; }
    if (hit.closest('.wb-stage')) {
      const e = addText(toWorld(ev.clientX, ev.clientY));
      requestAnimationFrame(() => startEdit(e.id, true));
    }
  }

  function onKeyDown(ev) {
    if (isView()) {
      // View mode: only the view keys (fit, 100%, zoom). No undo, no tools.
      if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
      const zk = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
      if (zk === 'f') fit();
      else if (zk === '0') zoomCenter(1);
      else if (zk === '=' || zk === '+') zoomCenter(view.z * 1.2);
      else if (zk === '-') zoomCenter(view.z / 1.2);
      return;
    }
    if (editing) {
      if (ev.key === 'Escape' || (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey))) { ev.preventDefault(); finishEdit(); }
      return;
    }
    if (labelCtx) {
      if (ev.key === 'Enter') { ev.preventDefault(); closeLabel(true); }
      else if (ev.key === 'Escape') { ev.preventDefault(); closeLabel(false); }
      return;
    }
    const tag = ev.target && ev.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    const mod = ev.ctrlKey || ev.metaKey;
    const k = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
    if (mod) {
      if (k === 'z') { ev.preventDefault(); if (ev.shiftKey) redo(); else undo(); }
      else if (k === 'y') { ev.preventDefault(); redo(); }
      else if (k === 's') { ev.preventDefault(); if (cfg.mode === 'dev') saveNow(); else saveCopy(); }
      else if (k === 'd') { ev.preventDefault(); duplicate(); }
      else if (k === 'a') { ev.preventDefault(); selected = new Set(board.elements.map((e) => e.id)); render(); }
      return;
    }
    if (ev.altKey) return;
    const nudge = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
    if (nudge) {
      const boxes = [...selected].map(byId).filter(isBox);
      if (!boxes.length) return;
      ev.preventDefault();
      const step = ev.shiftKey ? GRID : 1;
      mutate(() => boxes.forEach((e) => { e.x += nudge[0] * step; e.y += nudge[1] * step; }));
      return;
    }
    switch (k) {
      case 'Delete': case 'Backspace': if (selected.size) { ev.preventDefault(); deleteSelection(); } break;
      case 'Escape':
        if (arrowDraft) { arrowDraft = null; ui.stage.classList.remove('is-linking'); setDrop(null); }
        tool = 'text'; setTool('select'); selected.clear(); toggleHelp(false); render(); break;
      case 'v': setTool('select'); break;
      case 't': setTool('text'); break;
      case 'a': setTool('arrow'); break;
      case 'b': braceFromSelection(); break;
      case 'p': ui.file.click(); break;
      case 's': toggleStyleOrSide(); break;
      case 'f': fit(); break;
      case '0': zoomCenter(1); break;
      case '=': case '+': zoomCenter(view.z * 1.2); break;
      case '-': zoomCenter(view.z / 1.2); break;
      case '?': toggleHelp(); break;
      case 'Enter': { const one = single(); if (one) { ev.preventDefault(); if (one.type === 'text') startEdit(one.id); else editLabel(one); } break; }
      case ' ': if (!spaceDown) { spaceDown = true; ui.stage.classList.add('space-pan'); } ev.preventDefault(); break;
      default: break;
    }
  }

  function bindEvents() {
    ui.stage.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
    ui.stage.addEventListener('dblclick', onDblClick);
    ui.stage.addEventListener('wheel', (ev) => {
      ev.preventDefault();
      if (ev.ctrlKey || ev.metaKey) zoomAt(ev.clientX, ev.clientY, view.z * Math.exp(-ev.deltaY * 0.01));
      else { view.x -= ev.deltaX; view.y -= ev.deltaY; applyView(); }
    }, { passive: false });
    // Safari: stop iOS from zooming the whole page; the pointer handlers do the pinch.
    for (const type of ['gesturestart', 'gesturechange']) ui.stage.addEventListener(type, (ev) => ev.preventDefault(), { passive: false });
    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('keyup', (ev) => { if (ev.key === ' ') { spaceDown = false; ui.stage.classList.remove('space-pan'); } });
    ui.editorInput.addEventListener('blur', () => closeLabel(true));
    window.addEventListener('resize', () => scheduleLinks());
    document.addEventListener('paste', async (ev) => {
      if (isView() || editing || labelCtx) return;
      const items = [...(ev.clipboardData ? ev.clipboardData.items : [])];
      const files = items.filter((i) => i.kind === 'file').map((i) => i.getAsFile()).filter(Boolean);
      if (files.length) { ev.preventDefault(); addImageFiles(files, centerPoint()); return; }
      const text = ev.clipboardData && ev.clipboardData.getData('text/plain');
      if (text && text.trim()) { ev.preventDefault(); addText(centerPoint(), text.trim()); afterChange(); }
    });
    ui.stage.addEventListener('dragover', (ev) => { ev.preventDefault(); });
    ui.stage.addEventListener('drop', (ev) => {
      ev.preventDefault();
      if (isView()) return;
      const files = [...(ev.dataTransfer ? ev.dataTransfer.files : [])];
      if (files.length) addImageFiles(files, toWorld(ev.clientX, ev.clientY));
    });
  }

  /* ---------------- layout report (used by `npm run check`) ---------------- */
  WB.layoutReport = function () {
    renderLinks();
    const boxes = board.elements.filter(isBox).map((e) => Object.assign({ id: e.id }, rectOf(e)));
    const hit = (a, b, m) => a.x < b.x + b.w - m && b.x < a.x + a.w - m && a.y < b.y + b.h - m && b.y < a.y + a.h - m;
    const overlaps = [], tooClose = [];
    for (let i = 0; i < boxes.length; i++) {
      for (let j = i + 1; j < boxes.length; j++) {
        const a = boxes[i], b = boxes[j];
        if (hit(a, b, 2)) overlaps.push([a.id, b.id]);
        else {
          const gx = Math.max(b.x - (a.x + a.w), a.x - (b.x + b.w), 0);
          const gy = Math.max(b.y - (a.y + a.h), a.y - (b.y + b.h), 0);
          if (Math.max(gx, gy) < 16) tooClose.push([a.id, b.id, Math.round(Math.max(gx, gy))]);
        }
      }
    }
    const arrowsThroughBoxes = [];
    for (const e of board.elements) {
      if (e.type !== 'arrow') continue;
      const G = arrowGeom(e);
      if (!G) continue;
      const ends = new Set();
      for (const w of ['from', 'to']) {
        const r = byId(e[w]);
        if (r) { ends.add(r.id); if (r.type === 'brace') r.members.forEach((m) => ends.add(m)); }
      }
      for (const b of boxes) {
        if (ends.has(b.id)) continue;
        for (let k = 0.08; k <= 0.92; k += 0.04) {
          const q = qpt(G, k);
          if (q.x > b.x + 3 && q.x < b.x + b.w - 3 && q.y > b.y + 3 && q.y < b.y + b.h - 3) { arrowsThroughBoxes.push([e.id, b.id]); break; }
        }
      }
    }
    const bracesCrossingBoxes = [];
    for (const [id, g] of braceCache) {
      const xs = [g.p1.x, g.p2.x, g.tip.x], ys = [g.p1.y, g.p2.y, g.tip.y];
      const r = { x: Math.min(...xs) - 2, y: Math.min(...ys) - 2, w: Math.max(...xs) - Math.min(...xs) + 4, h: Math.max(...ys) - Math.min(...ys) + 4 };
      const members = new Set(byId(id).members);
      for (const b of boxes) if (!members.has(b.id) && hit(r, b, 0)) bracesCrossingBoxes.push([id, b.id]);
    }
    const broken = [];
    for (const [id, n] of nodes) if (n.el.classList.contains('is-broken')) broken.push(id);
    const dangling = [];
    for (const e of board.elements) {
      if (e.type === 'arrow') for (const w of ['from', 'to']) if (typeof e[w] === 'string' && !byId(e[w])) dangling.push(e.id + '.' + w + ' -> ' + e[w]);
      if (e.type === 'brace') for (const m of e.members) if (!byId(m)) dangling.push(e.id + '.members -> ' + m);
    }
    const b = bounds();
    return {
      elements: board.elements.length, boxes: boxes.length,
      bounds: { x: Math.round(b.x1), y: Math.round(b.y1), w: Math.round(b.x2 - b.x1), h: Math.round(b.y2 - b.y1) },
      overlaps, tooClose, arrowsThroughBoxes, bracesCrossingBoxes, brokenPictures: broken, danglingRefs: dangling,
      measured: Object.fromEntries(boxes.map((x) => [x.id, { x: x.x, y: x.y, w: Math.round(x.w), h: Math.round(x.h) }])),
    };
  };
  WB.setView = function (x, y, z) { view.x = x; view.y = y; view.z = z; applyView(); };
})();

</script>
<script>WB.boot({"mode":"view","board":"asm-stack-frames"});</script>
</body>
