<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assembly stack frames</title>
<style>
/* Whiteboard engine styles. Colors are tokens so a board can be re-themed in one place. */
:root {
  --wb-canvas: #F5F8FA;
  --wb-grid: #E8EFF3;
  --wb-grid-major: #DAE5EB;
  --wb-ink: #1E2B46;          /* marker navy: text, arrows, braces */
  --wb-ink-soft: #5B6A82;
  --wb-line: #C6D2DC;
  --wb-blue: #2A62B8;         /* selection + blue marker */
  --wb-red: #C23A3A;
  --wb-green: #22784B;
  --wb-yellow: #FFF0A3;
  --wb-mint: #D7F0E0;
  --wb-sky: #DAE8FA;
  --wb-rose: #FADDE2;
  --wb-fog: #E9EDF2;
  --wb-tray: #1E2B46;
  --wb-tray-ink: #E6ECF5;
  --wb-tray-hi: #F5F8FA;
  --wb-font: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --wb-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

html, body { margin: 0; height: 100%; overflow: hidden; background: var(--wb-canvas); color: var(--wb-ink); font-family: var(--wb-ui); }
#wb-root { position: fixed; inset: 0; }

/* ---------- canvas ---------- */
.wb-stage {
  position: absolute; inset: 0; overflow: hidden; outline: none; touch-action: none; cursor: default;
  background-color: var(--wb-canvas);
  background-image:
    linear-gradient(var(--wb-grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--wb-grid-major) 1px, transparent 1px),
    linear-gradient(var(--wb-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--wb-grid) 1px, transparent 1px);
}
.wb-stage.is-zoomed-out { background-image:
    linear-gradient(var(--wb-grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--wb-grid-major) 1px, transparent 1px); }
.wb-stage.space-pan, .wb-stage.is-panning { cursor: grab; }
.wb-stage.is-panning { cursor: grabbing; }
.wb-stage.tool-text { cursor: text; }
.wb-stage.tool-arrow { cursor: crosshair; }
.wb-stage.is-dragging iframe, .wb-stage.tool-arrow iframe, .wb-stage.is-linking iframe, .wb-stage.space-pan iframe { pointer-events: none; }
.wb-stage.is-panning iframe { pointer-events: none; }
/* View mode (published boards): every drag pans, so everything outside the diagrams shows the grab hand. */
.wb-stage.is-view, .wb-stage.is-view * { cursor: grab; }
.wb-stage.is-view.is-panning, .wb-stage.is-view.is-panning * { cursor: grabbing; }
.wb-stage.is-dragging, .wb-stage.is-linking { user-select: none; }

.wb-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.wb-boxes { position: absolute; left: 0; top: 0; }
.wb-links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

/* ---------- boxes ---------- */
.wb-box { position: absolute; box-sizing: border-box; }
.wb-box.is-selected, .wb-box.is-editing { outline: 2px solid var(--wb-blue); outline-offset: 3px; }
.wb-box.is-member { outline: 1.5px dashed var(--wb-blue); outline-offset: 5px; }
.wb-box.is-drop { outline: 3px solid var(--wb-blue); outline-offset: 4px; }

/* text */
.wb-txt { white-space: pre-wrap; overflow-wrap: break-word; font-family: var(--wb-font); font-size: 15px; line-height: 1.45; outline: none; min-height: 1.45em; }
.wb-txt b { font-weight: 750; }
.wb-txt code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88em; background: rgba(30, 43, 70, .07); padding: 0 .25em; border-radius: 3px; }
.is-editing .wb-txt { cursor: text; }

.v-card { background: #fff; border: 1.5px solid var(--wb-line); border-radius: 6px; padding: 9px 12px; }
.v-note { background: var(--wb-yellow); border-radius: 2px; padding: 12px 14px; box-shadow: 0 1px 0 rgba(30, 43, 70, .08), 0 10px 18px -12px rgba(30, 43, 70, .38); }
.v-title .wb-txt { font-size: 32px; line-height: 1.15; font-weight: 800; letter-spacing: -.012em; }
.v-heading .wb-txt { font-size: 20px; line-height: 1.25; font-weight: 700; }
.v-bare { padding: 2px 0; }

.v-card.c-yellow, .v-note.c-yellow { background: var(--wb-yellow); }
.v-card.c-green, .v-note.c-green { background: var(--wb-mint); }
.v-card.c-blue, .v-note.c-blue { background: var(--wb-sky); }
.v-card.c-pink, .v-note.c-pink { background: var(--wb-rose); }
.v-card.c-gray, .v-note.c-gray { background: var(--wb-fog); }
.v-card.c-yellow { border-color: #E6D166; }
.v-card.c-green { border-color: #A9D9BB; }
.v-card.c-blue { border-color: #A8C6EE; }
.v-card.c-pink { border-color: #EDB3BD; }
.v-card.c-gray { border-color: #CCD4DE; }
:is(.v-title, .v-heading, .v-bare).c-blue { color: var(--wb-blue); }
:is(.v-title, .v-heading, .v-bare).c-green { color: var(--wb-green); }
:is(.v-title, .v-heading, .v-bare).c-pink { color: var(--wb-red); }
:is(.v-title, .v-heading, .v-bare).c-gray { color: var(--wb-ink-soft); }
:is(.v-title, .v-heading, .v-bare).c-yellow .wb-txt { display: inline; background: linear-gradient(transparent 58%, var(--wb-yellow) 58%); -webkit-box-decoration-break: clone; box-decoration-break: clone; }

/* picture */
.t-picture { background: #fff; border: 1px solid var(--wb-line); border-radius: 4px; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
.wb-pic { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.wb-pic img { max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
.wb-caption { font-family: var(--wb-font); font-size: 13px; color: var(--wb-ink-soft); text-align: center; line-height: 1.3; flex: none; }
.wb-broken-msg { display: none; font-size: 12px; color: var(--wb-red); text-align: center; padding: 8px; }
.is-broken .wb-pic img { display: none; }
.is-broken .wb-broken-msg { display: block; }

/* diagram */
.t-diagram { background: #fff; border: 1.5px solid var(--wb-ink-soft); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
.t-diagram.is-selected { overflow: visible; }
.wb-dhead { height: 28px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--wb-fog); border-bottom: 1px solid var(--wb-line); border-radius: 6px 6px 0 0; font-size: 12.5px; font-weight: 600; color: var(--wb-ink); cursor: grab; user-select: none; white-space: nowrap; overflow: hidden; }
.wb-dhead .wb-ico { width: 15px; height: 15px; color: var(--wb-ink-soft); }
.wb-dbody { flex: 1; min-height: 0; border-radius: 0 0 6px 6px; overflow: hidden; }
.wb-dbody iframe { border: 0; width: 100%; height: 100%; display: block; background: #fff; }

/* resize handle */
.wb-resize { position: absolute; right: -8px; bottom: -8px; width: 12px; height: 12px; border-radius: 3px; background: #fff; border: 2px solid var(--wb-blue); display: none; cursor: nwse-resize; box-sizing: border-box; z-index: 2; }
.is-selected > .wb-resize { display: block; }
.t-text > .wb-resize { top: 50%; bottom: auto; margin-top: -6px; cursor: ew-resize; }

/* ---------- arrows & braces ---------- */
.wb-stroke { fill: none; stroke: var(--wb-ink); stroke-width: 2; stroke-linecap: round; }
.wb-head { fill: var(--wb-ink); stroke: var(--wb-ink); stroke-width: 1; stroke-linejoin: round; }
.wb-stroke-outer { fill: none; stroke: var(--wb-ink); stroke-width: 7; }
.wb-stroke-inner { fill: none; stroke: var(--wb-canvas); stroke-width: 3; }
.wb-head-open { fill: none; stroke: var(--wb-ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wb-arrow.is-selected .wb-stroke, .wb-arrow.is-selected .wb-stroke-outer, .wb-arrow.is-selected .wb-head-open { stroke: var(--wb-blue); }
.wb-arrow.is-selected .wb-head { fill: var(--wb-blue); stroke: var(--wb-blue); }
.wb-hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }
.wb-link-label { font: 600 13px var(--wb-font); fill: var(--wb-ink); paint-order: stroke; stroke: var(--wb-canvas); stroke-width: 6px; stroke-linejoin: round; pointer-events: all; cursor: pointer; }
.wb-brace-path { fill: none; stroke: var(--wb-ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.wb-brace.is-selected .wb-brace-path { stroke: var(--wb-blue); }
.wb-brace-label { font: 700 14px var(--wb-font); fill: var(--wb-ink); pointer-events: all; cursor: pointer; paint-order: stroke; stroke: var(--wb-canvas); stroke-width: 5px; stroke-linejoin: round; }
.wb-brace.is-selected .wb-brace-label { fill: var(--wb-blue); }
.wb-handle { fill: #fff; stroke: var(--wb-blue); stroke-width: 2; pointer-events: all; cursor: grab; }
.wb-handle.mid { fill: var(--wb-blue); stroke: #fff; }
.wb-draft { fill: none; stroke: var(--wb-blue); stroke-width: 2; stroke-dasharray: 6 5; }
.wb-draft-dot { fill: var(--wb-blue); }

.wb-marquee { position: absolute; border: 1.5px dashed var(--wb-blue); background: rgba(42, 98, 184, .06); pointer-events: none; }

/* ---------- chrome ---------- */
.wb-top { position: fixed; left: 14px; top: 12px; display: flex; align-items: center; gap: 10px; pointer-events: none; max-width: calc(100vw - 28px); }
.wb-board-title { font: 700 14px var(--wb-ui); color: var(--wb-ink); background: rgba(255, 255, 255, .88); border: 1px solid var(--wb-line); padding: 6px 10px; border-radius: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wb-status { font-size: 12.5px; color: var(--wb-ink-soft); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.wb-status[hidden] { display: none; }
.wb-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dot, #3BA776); flex: none; }
.wb-status[data-state="saving"] { --dot: #D8A31A; }
.wb-status[data-state="dirty"] { --dot: #D8A31A; }
.wb-status[data-state="offline"], .wb-status[data-state="error"] { --dot: var(--wb-red); color: var(--wb-red); }

.wb-tray { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 6px; background: var(--wb-tray); color: var(--wb-tray-ink); border-radius: 12px; box-shadow: 0 14px 30px -16px rgba(30, 43, 70, .7); max-width: calc(100vw - 24px); overflow-x: auto; box-sizing: border-box; z-index: 4; }
.wb-group { display: flex; gap: 2px; align-items: center; flex: none; }
.wb-sep { width: 1px; height: 24px; background: rgba(230, 236, 245, .18); margin: 0 4px; flex: none; }
.wb-btn { appearance: none; border: 0; background: transparent; color: inherit; font: 500 13px var(--wb-ui); display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.wb-btn:hover { background: rgba(230, 236, 245, .12); }
.wb-btn[aria-pressed="true"] { background: var(--wb-tray-hi); color: var(--wb-ink); }
.wb-btn:disabled { opacity: .35; cursor: default; background: transparent; }
.wb-btn:focus-visible, .wb-swatch:focus-visible, .wb-select:focus-visible { outline: 2px solid #8FB6F0; outline-offset: 1px; }
.wb-btn.wb-icon { padding: 7px; }
.wb-ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wb-select { appearance: none; background: rgba(230, 236, 245, .1); color: inherit; border: 1px solid rgba(230, 236, 245, .2); border-radius: 7px; font: 500 13px var(--wb-ui); padding: 6px 26px 6px 9px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: right 13px center, right 8px center; background-size: 5px 5px; background-repeat: no-repeat; }
.wb-select option { color: #1E2B46; }
.wb-swatches { display: flex; gap: 5px; padding: 0 6px; }
.wb-swatch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(230, 236, 245, .3); cursor: pointer; padding: 0; }
.wb-swatch[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px var(--wb-tray), 0 0 0 3.5px #fff; }
.wb-swatch.c-none { background: linear-gradient(135deg, #fff 44%, var(--wb-red) 44% 56%, #fff 56%); }
.wb-swatch.c-yellow { background: var(--wb-yellow); }
.wb-swatch.c-green { background: var(--wb-mint); }
.wb-swatch.c-blue { background: var(--wb-sky); }
.wb-swatch.c-pink { background: var(--wb-rose); }
.wb-swatch.c-gray { background: var(--wb-fog); }
@media (max-width: 860px) { .wb-btn-label { display: none; } .wb-btn { padding: 7px; } }

.wb-toast { position: fixed; left: 50%; bottom: 74px; transform: translate(-50%, 8px); background: var(--wb-ink); color: #fff; font-size: 13px; line-height: 1.4; padding: 8px 14px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; max-width: min(560px, 90vw); text-align: center; z-index: 6; }
.wb-toast.is-on { opacity: 1; transform: translate(-50%, 0); }

.wb-label-editor { position: fixed; z-index: 7; transform: translate(-50%, -50%); }
.wb-label-editor input { font: 600 14px var(--wb-font); color: var(--wb-ink); border: 2px solid var(--wb-blue); border-radius: 7px; padding: 6px 9px; min-width: 200px; outline: none; background: #fff; box-shadow: 0 8px 20px -10px rgba(30, 43, 70, .5); }

.wb-help { position: fixed; right: 14px; top: 12px; bottom: 76px; width: min(340px, calc(100vw - 28px)); overflow: auto; background: #fff; border: 1px solid var(--wb-line); border-radius: 10px; padding: 16px 18px; box-sizing: border-box; box-shadow: 0 16px 40px -20px rgba(30, 43, 70, .5); z-index: 5; font-size: 13.5px; line-height: 1.45; }
.wb-help h2 { font-size: 16px; margin: 0 0 10px; }
.wb-help h3 { font-size: 13.5px; margin: 14px 0 6px; color: var(--wb-ink-soft); }
.wb-help dl { display: grid; grid-template-columns: max-content 1fr; gap: 5px 12px; margin: 0; }
.wb-help dt { font-weight: 600; }
.wb-help dd { margin: 0; color: var(--wb-ink-soft); }
.wb-help kbd { font: 600 11.5px var(--wb-ui); border: 1px solid var(--wb-line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--wb-canvas); }
.wb-help .wb-close { position: absolute; right: 10px; top: 10px; color: var(--wb-ink); }
.wb-help .wb-close:hover { background: var(--wb-fog); }


/* =====================================================================
   Minimal theme ("theme": "minimal" in board.json)
   Same look as the diagram kit: warm grays, hairlines, two weights, flat.
   ===================================================================== */
:root[data-theme="minimal"] {
  --wb-canvas: #f9f9f7;
  --wb-grid: #dcdad3;
  --wb-grid-major: #dcdad3;
  --wb-ink: #0b0b0b;
  --wb-ink-soft: #52514e;
  --wb-line: rgba(11, 11, 11, 0.16);
  --wb-blue: #2a78d6;
  --wb-red: #A32D2D;
  --wb-green: #0F6E56;
  --wb-yellow: #FAEEDA;
  --wb-mint: #E1F5EE;
  --wb-sky: #E6F1FB;
  --wb-rose: #FBEAF0;
  --wb-fog: #F1EFE8;
  --wb-tray: #ffffff;
  --wb-tray-ink: #0b0b0b;
  --wb-tray-hi: #f0efec;
  --wb-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --wb-arrow: #52514e;
}
[data-theme="minimal"] .wb-stage { background-image: none, none, radial-gradient(circle at 1px 1px, var(--wb-grid) 1px, transparent 1.4px), none; }
[data-theme="minimal"] .wb-stage.is-zoomed-out { background-image: none; }
[data-theme="minimal"] .wb-txt { font-size: 14px; line-height: 1.5; }
[data-theme="minimal"] .wb-txt b { font-weight: 500; }
[data-theme="minimal"] .v-card { border: 0.5px solid var(--wb-line); border-radius: 8px; padding: 10px 14px; }
[data-theme="minimal"] .v-note { border: 0.5px solid #EF9F27; border-radius: 8px; box-shadow: none; color: #633806; }
[data-theme="minimal"] .v-title .wb-txt { font-size: 28px; font-weight: 500; letter-spacing: -0.01em; }
[data-theme="minimal"] .v-heading .wb-txt { font-size: 18px; font-weight: 500; }
[data-theme="minimal"] .v-bare .wb-txt { color: var(--wb-ink-soft); }
/* colored cards: 50 fill, 600 hairline, 800 text */
[data-theme="minimal"] :is(.v-card, .v-note).c-yellow { background: #FAEEDA; border-color: #854F0B; color: #633806; }
[data-theme="minimal"] :is(.v-card, .v-note).c-green  { background: #E1F5EE; border-color: #0F6E56; color: #085041; }
[data-theme="minimal"] :is(.v-card, .v-note).c-blue   { background: #E6F1FB; border-color: #185FA5; color: #0C447C; }
[data-theme="minimal"] :is(.v-card, .v-note).c-pink   { background: #FBEAF0; border-color: #993556; color: #72243E; }
[data-theme="minimal"] :is(.v-card, .v-note).c-gray   { background: #F1EFE8; border-color: #5F5E5A; color: #444441; }
[data-theme="minimal"] :is(.v-title, .v-heading, .v-bare).c-blue { color: #185FA5; }
[data-theme="minimal"] :is(.v-title, .v-heading, .v-bare).c-green { color: #0F6E56; }
[data-theme="minimal"] :is(.v-title, .v-heading, .v-bare).c-pink { color: #993556; }
[data-theme="minimal"] :is(.v-title, .v-heading, .v-bare).c-yellow .wb-txt { background: linear-gradient(transparent 58%, rgba(250, 178, 25, 0.33) 58%); }
[data-theme="minimal"] .t-picture { border: 0.5px solid var(--wb-line); border-radius: 8px; padding: 8px; }
[data-theme="minimal"] .wb-caption { font-size: 12px; }
[data-theme="minimal"] .t-diagram { border: 0.5px solid rgba(11, 11, 11, 0.22); border-radius: 12px; }
[data-theme="minimal"] .wb-dhead { background: #fff; border-bottom: 0.5px solid var(--wb-line); border-radius: 11px 11px 0 0; font-weight: 500; font-size: 12px; color: var(--wb-ink-soft); height: 30px; padding: 0 14px; }
[data-theme="minimal"] .wb-dbody { border-radius: 0 0 11px 11px; }
[data-theme="minimal"] .wb-stroke { stroke: var(--wb-arrow); stroke-width: 1.5; }
[data-theme="minimal"] .wb-head { fill: none; stroke: var(--wb-arrow); stroke-width: 1.5; stroke-linecap: round; }
[data-theme="minimal"] .wb-stroke-outer { stroke: var(--wb-arrow); stroke-width: 5.5; }
[data-theme="minimal"] .wb-stroke-inner { stroke: var(--wb-canvas); stroke-width: 2.5; }
[data-theme="minimal"] .wb-head-open { stroke: var(--wb-arrow); stroke-width: 1.5; }
[data-theme="minimal"] .wb-arrow.is-selected .wb-head { fill: none; }
[data-theme="minimal"] .wb-link-label { font-weight: 400; font-size: 12px; fill: var(--wb-ink-soft); }
[data-theme="minimal"] .wb-brace-path { stroke: var(--wb-arrow); stroke-width: 1.5; }
[data-theme="minimal"] .wb-brace-label { font-weight: 500; font-size: 13px; fill: var(--wb-ink); }
[data-theme="minimal"] .wb-board-title { font-weight: 500; border-width: 0.5px; }
[data-theme="minimal"] .wb-tray { border: 0.5px solid var(--wb-line); box-shadow: 0 8px 24px -14px rgba(11, 11, 11, 0.25); }
[data-theme="minimal"] .wb-btn:hover { background: var(--wb-tray-hi); }
[data-theme="minimal"] .wb-sep { background: var(--wb-line); }
[data-theme="minimal"] .wb-select { background-color: transparent; border-color: var(--wb-line); }
[data-theme="minimal"] .wb-swatch { border-color: var(--wb-line); }
[data-theme="minimal"] .wb-swatch[aria-pressed="true"] { border-color: var(--wb-ink); box-shadow: none; }
[data-theme="minimal"] .wb-swatch.c-yellow { background: #FAEEDA; }
[data-theme="minimal"] .wb-swatch.c-green { background: #E1F5EE; }
[data-theme="minimal"] .wb-swatch.c-blue { background: #E6F1FB; }
[data-theme="minimal"] .wb-swatch.c-pink { background: #FBEAF0; }
[data-theme="minimal"] .wb-swatch.c-gray { background: #F1EFE8; }

@media (prefers-reduced-motion: reduce) { .wb-toast { transition: none; } }
@media print { .wb-tray, .wb-top, .wb-toast, .wb-help { display: none !important; } }

</style>
</head>

 * sentence case, color only where it carries meaning.\n * Diagrams link this file and diagram-kit.js with relative paths\n * (../../../engine/...); see engine/DIAGRAM_STYLE.md. The export script\n * inlines both, so exported boards still work offline.\n */\n:root {\n  /* surfaces and ink */\n  --surface: #ffffff;\n  --surface-1: #fcfcfb;\n  --surface-2: #f5f4f0;\n  --text-primary: #0b0b0b;\n  --text-secondary: #52514e;\n  --text-muted: #898781;\n  --grid: #ecebe5;\n  --axis: #c3c2b7;\n  --border: rgba(11, 11, 11, 0.10);\n  --border-strong: rgba(11, 11, 11, 0.20);\n  --accent: #2a78d6;\n  --highlight: rgba(250, 178, 25, 0.33);\n\n  /* series colors: always assign in this order, never cycle */\n  --series-1: #2a78d6;   /* blue */\n  --series-2: #eb6834;   /* orange */\n  --series-3: #1baf7a;   /* aqua */\n  --series-4: #eda100;   /* yellow */\n  --series-5: #e87ba4;   /* magenta */\n  --series-6: #008300;   /* green */\n  --series-7: #6250d6;   /* violet */\n  --series-8: #e34948;   /* red */\n  --context: #c3c2b7;    /* de-emphasized series */\n\n  --font: ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", sans-serif;\n  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n  --radius: 8px;\n}\n\n* { box-sizing: border-box; }\nhtml, body { margin: 0; background: var(--surface); color: var(--text-primary); }\nbody {\n  font: 400 14px/1.5 var(--font);\n  padding: 14px 18px 12px;\n  min-height: 100vh;\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n  -webkit-font-smoothing: antialiased;\n}\nb, strong, h1, h2, h3, th { font-weight: 500; }\ncode, .mono { font-family: var(--mono); font-size: 0.92em; }\n.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n\n/* ---------- layout ---------- */\n.dk-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }\n.dk-fill { flex: 1; min-height: 0; position: relative; display: flex; }\n.dk-fill > svg { flex: 1; width: 100%; height: 100%; display: block; }\n.dk-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; flex: 1; min-height: 0; }\n\n/* ---------- text ---------- */\n.dk-caption { font-size: 12px; color: var(--text-muted); }\n.dk-readout { font-size: 14px; color: var(--text-secondary); min-height: 1.5em; }\n.dk-readout b { color: var(--text-primary); }\n.dk-value { font-weight: 500; color: var(--text-primary); font-variant-numeric: tabular-nums; }\n.dk-mark { background: linear-gradient(transparent 55%, var(--highlight) 55%); }\n\n/* ---------- controls ---------- */\n.dk-control { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-secondary); }\n.dk-control output { min-width: 3.2em; color: var(--text-primary); font-weight: 500; font-variant-numeric: tabular-nums; }\ninput[type=range] { appearance: none; -webkit-appearance: none; width: 140px; height: 18px; background: transparent; margin: 0; cursor: pointer; }\ninput[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--text-primary) var(--p, 0%), var(--grid) var(--p, 0%)); }\ninput[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--grid); }\ninput[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--text-primary); }\ninput[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text-primary); }\ninput[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text-primary); }\n\nbutton, .dk-btn {\n  font: 400 13px var(--font); color: var(--text-primary); background: transparent;\n  border: 0.5px solid var(--border-strong); border-radius: var(--radius); padding: 5px 12px; cursor: pointer;\n}\nbutton:hover { background: var(--surface-2); }\nbutton:active { transform: scale(0.98); }\nbutton:disabled { color: var(--text-muted); cursor: default; background: transparent; transform: none; }\n:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n\n.dk-seg { display: inline-flex; border: 0.5px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; }\n.dk-seg button { border: 0; border-radius: 0; padding: 5px 11px; }\n.dk-seg button + button { border-left: 0.5px solid var(--border-strong); }\n.dk-seg button[aria-pressed=\"true\"] { background: var(--text-primary); color: var(--surface); }\n\n.dk-toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; user-select: none; }\n.dk-toggle input { appearance: none; -webkit-appearance: none; width: 30px; height: 18px; border-radius: 9px; background: var(--axis); position: relative; cursor: pointer; margin: 0; transition: background .15s; }\n.dk-toggle input::after { content: \"\"; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }\n.dk-toggle input:checked { background: var(--text-primary); }\n.dk-toggle input:checked::after { transform: translateX(12px); }\n\n/* ---------- legend ---------- */\n.dk-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-secondary); }\n.dk-legend span { display: inline-flex; align-items: center; gap: 6px; }\n.dk-key-line { width: 14px; height: 0; border-top: 2px solid currentColor; border-radius: 1px; }\n.dk-key-dash { width: 14px; height: 0; border-top: 2px dashed currentColor; }\n.dk-key-box { width: 10px; height: 10px; border-radius: 2px; background: currentColor; }\n\n/* ---------- step-through ---------- */\n.dk-steps { display: flex; align-items: center; gap: 12px; }\n.dk-dots { display: flex; gap: 6px; }\n.dk-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--axis); }\n.dk-dots i.on { background: var(--text-primary); }\n.dk-steps .dk-count { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }\n\n/* ---------- SVG text and marks ---------- */\nsvg text { font-family: var(--font); }\n.t  { font-size: 14px; fill: var(--text-primary); }\n.th { font-size: 14px; font-weight: 500; fill: var(--text-primary); }\n.ts { font-size: 12px; fill: var(--text-secondary); }\n.tm { font-size: 11px; fill: var(--text-muted); font-variant-numeric: tabular-nums; }\n.tmono { font-family: var(--mono); font-size: 12px; fill: var(--text-primary); }\n.dk-grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }\n.dk-axis { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }\n.dk-zero { stroke: var(--axis); stroke-width: 1; }\n.dk-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }\n.dk-area { stroke: none; opacity: 0.10; }\n.dk-dot { stroke: var(--surface); stroke-width: 2; }\n.dk-guide { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 3; fill: none; }\n.dk-crosshair { stroke: var(--text-muted); stroke-width: 1; shape-rendering: crispEdges; }\n.box { fill: var(--surface-1); stroke: var(--border-strong); stroke-width: 0.5; }\n.arr { fill: none; stroke: var(--text-secondary); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }\n.leader { fill: none; stroke: var(--text-muted); stroke-width: 0.5; stroke-dasharray: 3 3; }\n\n/* Color ramps for boxes and regions: 50 fill, 600 stroke, 800 title, 600 subtitle.\n   Use on \u003crect>/\u003ccircle>/\u003cg>. Pick 2-3 per diagram; gray for neutral structure. */\n.c-gray   { --c50:#F1EFE8; --c200:#B4B2A9; --c600:#5F5E5A; --c800:#444441; }\n.c-blue   { --c50:#E6F1FB; --c200:#85B7EB; --c600:#185FA5; --c800:#0C447C; }\n.c-teal   { --c50:#E1F5EE; --c200:#5DCAA5; --c600:#0F6E56; --c800:#085041; }\n.c-purple { --c50:#EEEDFE; --c200:#AFA9EC; --c600:#534AB7; --c800:#3C3489; }\n.c-coral  { --c50:#FAECE7; --c200:#F0997B; --c600:#993C1D; --c800:#712B13; }\n.c-pink   { --c50:#FBEAF0; --c200:#ED93B1; --c600:#993556; --c800:#72243E; }\n.c-green  { --c50:#EAF3DE; --c200:#97C459; --c600:#3B6D11; --c800:#27500A; }\n.c-amber  { --c50:#FAEEDA; --c200:#EF9F27; --c600:#854F0B; --c800:#633806; }\n.c-red    { --c50:#FCEBEB; --c200:#F09595; --c600:#A32D2D; --c800:#791F1F; }\n:is(rect, circle, ellipse, polygon):is(.c-gray, .c-blue, .c-teal, .c-purple, .c-coral, .c-pink, .c-green, .c-amber, .c-red),\n:is(.c-gray, .c-blue, .c-teal, .c-purple, .c-coral, .c-pink, .c-green, .c-amber, .c-red) > :is(rect, circle, ellipse, polygon) {\n  fill: var(--c50); stroke: var(--c600); stroke-width: 0.5;\n}\n:is(.c-gray, .c-blue, .c-teal, .c-purple, .c-coral, .c-pink, .c-green, .c-amber, .c-red) > .th,\n:is(.c-gray, .c-blue, .c-teal, .c-purple, .c-coral, .c-pink, .c-green, .c-amber, .c-red) > .t { fill: var(--c800); }\n:is(.c-gray, .c-blue, .c-teal, .c-purple, .c-coral, .c-pink, .c-green, .c-amber, .c-red) > .ts,\n:is(.c-gray, .c-blue, .c-teal, .c-purple, .c-coral, .c-pink, .c-green, .c-amber, .c-red) > .tmono { fill: var(--c600); }\n.is-active > :is(rect, circle) { stroke-width: 1.5; }\n.c-chip { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12px; background: var(--c50); color: var(--c800); }\n\n/* ---------- tooltip ---------- */\n.dk-tip {\n  position: absolute; pointer-events: none; z-index: 2;\n  background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: var(--radius);\n  padding: 6px 10px; font-size: 12px; color: var(--text-secondary); white-space: nowrap;\n  box-shadow: 0 4px 14px -6px rgba(11, 11, 11, 0.18);\n}\n.dk-tip .dk-tip-head { color: var(--text-muted); margin-bottom: 2px; font-variant-numeric: tabular-nums; }\n.dk-tip .dk-tip-row { display: flex; align-items: center; gap: 8px; }\n.dk-tip .dk-tip-row .dk-value { margin-left: auto; padding-left: 12px; }\n\n/* ---------- motion ---------- */\n.dk-anim { transition: transform .25s ease, opacity .25s ease; }\n@media (prefers-reduced-motion: reduce) { .dk-anim, .dk-toggle input, .dk-toggle input::after { transition: none; } }\n\n\u003c/style>\n\u003cstyle>\n  .code { list-style: none; margin: 0; padding: 0; font: 12.5px/18px var(--mono); counter-reset: ln; }\n  .code li { display: flex; gap: 12px; padding: 0 8px; border-radius: 4px; color: var(--text-secondary); white-space: pre; }\n  .code li::before { counter-increment: ln; content: counter(ln); color: var(--text-muted); width: 1.4em; text-align: right; flex: none; }\n  .code li.label { color: var(--text-primary); font-weight: 500; }\n  .code li .c { color: var(--text-muted); }\n  .code li.on { background: #FAEEDA; color: #633806; }\n  .code li.on .c { color: #854F0B; }\n  .code li.target { box-shadow: inset 0 0 0 0.5px #854F0B; }\n  .regs { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin-top: 12px; }\n  .regs b { font: 500 12px var(--mono); color: var(--text-primary); }\n  .regs .changed b { background: linear-gradient(transparent 55%, var(--highlight) 55%); }\n  .phase { font-size: 12px; color: var(--text-muted); }\n  #stack { width: 100%; height: 100%; }\n  .stale > rect { fill: var(--surface); stroke: var(--axis); stroke-width: 0.75; stroke-dasharray: 4 3; }\n  .stale > text { fill: var(--text-muted); }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ch2 class=\"sr-only\">Step through calling and returning from a function in x86-64: call, push rbp, mov rbp rsp and sub rsp build the frame; the return value goes to eax, then add rsp, pop rbp and ret tear it down.\u003c/h2>\n\u003cdiv class=\"dk-split\" style=\"grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr)\">\n  \u003cdiv>\n    \u003col class=\"code\" id=\"code\">\u003c/ol>\n    \u003cdiv class=\"regs\" id=\"regs\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"dk-fill\">\u003csvg id=\"stack\" viewBox=\"0 0 340 310\" preserveAspectRatio=\"xMidYMin meet\" role=\"img\" aria-label=\"Stack memory\">\u003c/svg>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"dk-readout\" id=\"caption\">\u003c/div>\n\u003cdiv class=\"dk-row\" style=\"justify-content: space-between\">\n  \u003cdiv id=\"nav\">\u003c/div>\n  \u003cdiv class=\"dk-caption\">Illustrative, gcc -O0 style, simplified.\u003c/div>\n\u003c/div>\n\n\u003cscript>\n/*\n * Diagram kit helpers. No dependencies; everything draws plain SVG in the\n * shared style from diagram-kit.css. The main pieces:\n *\n *   DK.plot(el, opts)        function / data plot with axes, crosshair and tooltip\n *   DK.slider(parent, opts)  labelled range slider with a live value\n *   DK.segmented(parent, o)  pick-one buttons\n *   DK.toggle(parent, opts)  on/off switch\n *   DK.legend(parent, items) line / box keys (use for 2+ series)\n *   DK.stepper(parent, o)    Back / Next with dots, for step-through diagrams\n *   DK.svg(tag, attrs, parent), DK.h(tag, attrs, ...kids), DK.fmt(n), DK.color(i)\n *\n * See engine/DIAGRAM_STYLE.md for when to use each and the rules they follow.\n */\n(function () {\n  'use strict';\n  const NS = 'http://www.w3.org/2000/svg';\n  const SERIES = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'];\n  const INK = { primary: '#0b0b0b', secondary: '#52514e', muted: '#898781', grid: '#ecebe5', axis: '#c3c2b7', surface: '#ffffff', context: '#c3c2b7' };\n\n  function svg(tag, attrs, parent) {\n    const n = document.createElementNS(NS, tag);\n    for (const k in attrs || {}) {\n      const v = attrs[k];\n      if (v == null || v === false) continue;\n      if (k === 'text') n.textContent = v;\n      else n.setAttribute(k, v);\n    }\n    if (parent) parent.append(n);\n    return n;\n  }\n\n  function h(tag, attrs, ...kids) {\n    const n = document.createElement(tag);\n    for (const k in attrs || {}) {\n      const v = attrs[k];\n      if (v == null || v === false) continue;\n      if (k === 'text') n.textContent = v;\n      else if (k === 'class') n.className = v;\n      else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);\n      else n.setAttribute(k, v === true ? '' : v);\n    }\n    for (const kid of kids) if (kid != null) n.append(kid);\n    return n;\n  }\n\n  /** Series color by slot (1-based, fixed order). Pass 0 or 'context' for the gray de-emphasis color. */\n  function color(i) {\n    if (!i || i === 'context') return INK.context;\n    return SERIES[(i - 1) % SERIES.length];\n  }\n\n  /** Round for display. Uses a real minus sign, trims trailing zeros. */\n  function fmt(v, digits) {\n    if (v == null || !isFinite(v)) return '–';\n    if (digits == null) {\n      const a = Math.abs(v);\n      digits = a === 0 ? 0 : a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : 3;\n    }\n    let s = (+v.toFixed(digits)).toLocaleString('en-US', { maximumFractionDigits: digits });\n    if (s === '-0') s = '0';\n    return s.replace(/^-/, '−');\n  }\n\n  function niceStep(span, count) {\n    const raw = span / Math.max(1, count);\n    const p = Math.pow(10, Math.floor(Math.log10(raw)));\n    const m = raw / p;\n    return (m \u003c 1.5 ? 1 : m \u003c 3 ? 2 : m \u003c 7 ? 5 : 10) * p;\n  }\n  function ticks(min, max, count) {\n    const step = niceStep(max - min, count);\n    const out = [];\n    for (let v = Math.ceil(min / step) * step; v \u003c= max + step * 1e-9; v += step) out.push(Math.abs(v) \u003c step * 1e-9 ? 0 : v);\n    return { values: out, step };\n  }\n  function tickDigits(step) { return step >= 1 ? 0 : Math.min(6, Math.ceil(-Math.log10(step) - 1e-9)); }\n\n  /* ---------------- controls ---------------- */\n\n  function slider(parent, o) {\n    const out = h('output');\n    const input = h('input', { type: 'range', min: o.min, max: o.max, step: o.step ?? 'any', value: o.value, 'aria-label': o.label });\n    const show = () => {\n      out.textContent = o.format ? o.format(+input.value) : fmt(+input.value);\n      input.style.setProperty('--p', ((+input.value ems) {\n      const key = h('i', { class: it.kind === 'box' ? 'dk-key-box' : it.kind === 'dash' ? 'dk-key-dash' : 'dk-key-line' });\n      key.style.color = it.color;\n      wrap.append(h('span', null, key, document.createTextNode(it.label)));\n    }\n    parent.append(wrap);\n    return wrap;\n  }\n\n  function stepper(parent, o) {\n    let i = o.start || 0;\n    const back = h('button', { type: 'button', text: 'Back' });\n    const next = h('button', { type: 'button', text: 'Next' });\n    const dots = h('div', { class: 'dk-dots', 'aria-hidden': 'true' });\n    for (let k = 0; k \u003c o.count; k++) dots.append(h('i'));\n    const count = h('span', { class: 'dk-count' });\n    const wrap = h('div', { class: 'dk-steps' }, back, next, dots, count);\n    parent.append(wrap);\n    function go(k) {\n      if (o.loop) k = (k + o.count) % o.count;\n      i = Math.max(0, Math.min(o.count - 1, k));\n      back.disabled = !o.loop && i === 0;\n      next.disabled = !o.loop && i === o.count - 1;\n      [...dots.children].forEach((d, j) => d.classList.toggle('on', j === i));\n      count.textContent = (i + 1) + ' / ' + o.count;\n      o.render(i);\n    }\n    back.addEventListener('click', () => go(i - 1));\n    next.addEventListener('click', () => go(i + 1));\n    document.addEventListener('keydown', (e) => {\n      if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;\n      if (e.key === 'ArrowRight') go(i + 1);\n      if (e.key === 'ArrowLeft') go(i - 1);\n    });\n    go(i);\n    return { el: wrap, go, get index() { return i; } };\n  }\n\n  /** Adds an open-chevron arrow marker to an \u003csvg>; use marker-end=\"url(#id)\". */\n  function arrowDefs(root, id = 'dk-arrow', stroke = INK.secondary) {\n    let defs = root.querySelector('defs') || svg('defs', null, null);\n    if (!defs.parentNode) root.prepend(defs);\n    const m = svg('marker', { id, viewBox: '0 0 10 10', refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);\n    svg('path', { d: 'M2 1L8 5L2 9', fill: 'none', stroke, 'stroke-width': 1.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, m);\n    return 'url(#' + id + ')';\n  }\n\n  /* ---------------- plot ---------------- */\n  /*\n   * DK.plot(container, {\n   *   x: [min, max],                 required\n   *   y: [min, max] | 'auto',        default 'auto' (from the series)\n   *   xLabel, yLabel,                short, sentence case (y label sits above the axis, never rotated)\n   *   grid: 'y' | 'both' | 'none',   default 'y'; use 'both' for math graphs\n   *   xTicks, yTicks: count | array of values,\n   *   xFormat, yFormat: v => string,   hoverXFormat: v => string (tooltip title, defaults to xFormat)\n   *   series: [{ label, fn: x => y | points: [[x, y], ...], color, dashed, area, dots, endLabel }],\n   *   marks(g, api),                 custom drawing above the series (api.sx, api.sy, api.svg, api.clip ...)\n   *   hover: true,                   crosshair + tooltip; false turns both off (onHover still fires)\n   *   onHover(x | null, api),        react to the hovered x (safe to call update() from here)\n   *   tooltip(x) => { title, rows: [{ label, value, color }] }   optional custom tooltip\n   * })\n   * Returns { update(partialOpts), redraw(), api }.\n   */\n  function plot(container, opts) {\n    const el = typeof container === 'string' ? document.querySelector(container) : container;\n    el.style.position = el.style.position || 'relative';\n    const root = svg('svg', { role: 'img', 'aria-label': opts.ariaLabel || opts.yLabel || 'Plot' }, el);\n    root.style.overflow = 'visible';\n    const tip = h('div', { class: 'dk-tip', hidden: true });\n    el.append(tip);\n    let o = Object.assign({ grid: 'y', hover: true, y: 'auto', series: [] }, opts);\n    let api = null, hoverX = null, uid = Math.random().toString(36).slice(2, 7);\n\n    function yDomain(W) {\n      if (Array.isArray(o.y)) return o.y;\n      let lo = Infinity, hi = -Infinity;\n      for (const s of o.series) {\n        const pts = s.points || sample(s.fn, o.x[0], o.x[1], 200);\n        for (const [, y] of pts) if (isFinite(y)) { lo = Math.min(lo, y); hi = Math.max(hi, y); }\n      }\n      if (!isFinite(lo)) { lo = 0; hi = 1; }\n      if (lo === hi) { lo -= 1; hi += 1; }\n      const pad = (hi - lo) * 0.08;\n      if (lo >= 0 && lo - pad \u003c 0 && lo \u003c (hi - lo) * 0.3) lo = 0; else lo -= pad;\n      hi += pad;\n      const t = ticks(lo, hi, 5);\n      return [Math.min(lo, t.values[0]), Math.max(hi, t.values[t.values.length - 1])];\n    }\n\n    function sample(fn, a, b, n) {\n      const pts = [];\n      for (let k = 0; k \u003c= n; k++) { const x = a + (b - a) * k / n; pts.push([x, fn(x)]); }\n      return pts;\n    }\n\n    function draw() {\n      const W = Math.max(120, el.clientWidth), H = Math.max(100, el.clientHeight);\n      root.setAttribute('viewBox', `0 0 ${W} ${H}`);\n      root.setAttribute('width', W);\n      root.setAttribute('height', H);\n      root.textContent = '';\n      const [x0, x1] = o.x;\n      const [y0, y1] = yDomain(W);\n      const xt = Array.isArray(o.xTicks) ? { values: o.xTicks, step: 1 } : ticks(x0, x1, o.xTicks || Math.max(3, Math.round(W / 90)));\n      const yt = Array.isArray(o.yTicks) ? { values: o.yTicks, step: 1 } : ticks(y0, y1, o.yTicks || Math.max(3, Math.round(H / 60)));\n      const xf = o.xFormat || ((v) => fmt(v, tickDigits(xt.step)));\n      const yf = o.yFormat || ((v) => fmt(v, tickDigits(yt.step)));\n      const yLabelW = Math.max(...yt.values.map((v) => yf(v).length)) * 6.6 + 10;\n      const endW = Math.max(0, ...o.series.filter((s) => s.endLabel).map((s) => (s.label || '').length * 6.8 + 14));\n      const m = { l: Math.max(28, yLabelW), r: 10 + endW, t: o.yLabel ? 24 : 8, b: o.xLabel ? 40 : 24 };\n      const pw = W - m.l - m.r, ph = H - m.t - m.b;\n      const sx = (x) => m.l + (x - x0) / (x1 - x0) * pw;\n      const sy = (y) => m.t + (1 - (y - y0) / (y1 - y0)) * ph;\n      const ix = (px) => x0 + (px - m.l) / pw * (x1 - x0);\n\n      const defs = svg('defs', null, root);\n      const clip = svg('clipPath', { id: 'dk-clip-' + uid }, defs);\n      svg('rect', { x: m.l, y: m.t - 1, width: pw, height: ph + 2 }, clip);\n\n      // grid + ticks\n      const g = svg('g', null, root);\n      for (const v of yt.values) {\n        if (v \u003c y0 - 1e-9 || v > y1 + 1e-9) continue;\n        if (o.grid !== 'none') svg('line', { x1: m.l, x2: m.l + pw, y1: sy(v), y2: sy(v), class: 'dk-grid' }, g);\n        svg('text', { x: m.l - 8, y: sy(v), class: 'tm', 'text-anchor': 'end', 'dominant-baseline': 'central', text: yf(v) }, g);\n      }\n      for (const v of xt.values) {\n        if (v \u003c x0 - 1e-9 || v > x1 + 1e-9) continue;\n        if (o.grid === 'both') svg('line', { x1: sx(v), x2: sx(v), y1: m.t, y2: m.t + ph, class: 'dk-grid' }, g);\n        svg('text', { x: sx(v), y: m.t + ph + 15, class: 'tm', 'text-anchor': 'middle', text: xf(v) }, g);\n      }\n      // axes: zero lines when zero is in view, otherwise the plot edges\n      const ax = y0 \u003c= 0 && y1 >= 0 ? sy(0) : m.t + ph;\n      const ay = x0 \u003c= 0 && x1 >= 0 ? sx(0) : m.l;\n      svg('line', { x1: m.l, x2: m.l + pw, y1: ax, y2: ax, class: 'dk-axis' }, g);\n      svg('line', { x1: ay, x2: ay, y1: m.t, y2: m.t + ph, class: 'dk-axis' }, g);\n      if (o.xLabel) svg('text', { x: m.l + pw, y: H - 6, class: 'ts', 'text-anchor': 'end', text: o.xLabel }, g);\n      if (o.yLabel) svg('text', { x: m.l - 8, y: 12, class: 'ts', text: o.yLabel }, g);\n\n      api = { svg: root, sx, sy, ix, x: [x0, x1], y: [y0, y1], plot: { x: m.l, y: m.t, w: pw, h: ph }, clip: 'url(#dk-clip-' + uid + ')', color, el: (t, a, p) => svg(t, a, p) };\n\n      // series\n      const sg = svg('g', { 'clip-path': api.clip }, root);\n      const ends = [];\n      o.series.forEach((s, i) => {\n        const c = s.color || color(i + 1);\n        const pts = s.points || sample(s.fn, x0, x1, Math.max(60, Math.round(pw / 2)));\n        let d = '', pen = false, area = '';\n        for (const [x, y] of pts) {\n          if (!isFinite(y) || Math.abs(y - (y0 + y1) / 2) > (y1 - y0) * 20) { pen = false; continue; }\n          d += (pen ? 'L' : 'M') + sx(x).toFixed(1) + ',' + sy(y).toFixed(1);\n          pen = true;\n        }\n        if (s.area) {\n          const base = sy(Math.max(y0, Math.min(y1, 0)));\n          const fin = pts.filter(([, y]) => isFinite(y));\n          if (fin.length) area = `M${sx(fin[0][0])},${base}` + fin.map(([x, y]) => `L${sx(x).toFixed(1)},${sy(y).toFixed(1)}`).join('') + `L${sx(fin[fin.length - 1][0])},${base}Z`;\n          svg('path', { d: area, class: 'dk-area', fill: c }, sg);\n        }\n        if (!s.dotsOnly) svg('path', { d, class: 'dk-line', stroke: c, 'stroke-dasharray': s.dashed ? '6 5' : null }, sg);\n        if (s.points && (s.dots || s.dotsOnly)) for (const [x, y] of pts) svg('circle', { cx: sx(x), cy: sy(y), r: 4, class: 'dk-dot', fill: c }, sg);\n        if (s.endLabel) {\n          const last = [...pts].reverse().find(([, y]) => isFinite(y) && y >= y0 && y \u003c= y1);\n          if (last) ends.push({ y: sy(last[1]), x: sx(last[0]), label: s.label, c });\n        }\n      });\n      // end labels: nudge apart only a little; leader line keeps them attached\n      ends.sort((a, b) => a.y - b.y);\n      for (let k = 1; k \u003c ends.length; k++) if (ends[k].y - ends[k - 1].y \u003c 15) ends[k].ly = (ends[k - 1].ly ?? ends[k - 1].y) + 15;\n      for (const e of ends) {\n        const ly = e.ly ?? e.y;\n        if (Math.abs(ly - e.y) > 2) svg('path', { d: `M${e.x + 3},${e.y} L${e.x + 8},${ly}`, class: 'leader' }, root);\n        svg('text', { x: e.x + 10, y: ly, class: 'ts', 'dominant-baseline': 'central', text: e.label }, root);\n      }\n\n      if (o.marks) o.marks(svg('g', null, root), api);\n\n      // hover layer\n      const hg = svg('g', { 'pointer-events': 'none' }, root);\n      api.hoverLayer = hg;\n      if (hoverX != null) drawHover(hoverX);\n    }\n\n    function valueAt(s, x) {\n      if (s.fn) return s.fn(x);\n      let best = null;\n      for (const p of s.points) if (!best || Math.abs(p[0] - x) \u003c Math.abs(best[0] - x)) best = p;\n      return best ? best[1] : NaN;\n    }\n\n    function snapX(x) {\n      const pts = o.series.filter((s) => s.points).flatMap((s) => s.points.map((p) => p[0]));\n      if (!pts.length || o.series.some((s) => s.fn)) return x;\n      return pts.reduce((a, b) => (Math.abs(b - x) \u003c Math.abs(a - x) ? b : a));\n    }\n\n    function drawHover(x) {\n      const hg = api.hoverLayer;\n      hg.textContent = '';\n      tip.hidden = true;\n      if (x == null || !o.hover) return;\n      const { sx, sy, plot: P } = api;\n      const px = sx(x);\n      svg('line', { x1: px, x2: px, y1: P.y, y2: P.y + P.h, class: 'dk-crosshair' }, hg);\n      const rows = [];\n      o.series.forEach((s, i) => {\n        if (s.hover === false) return;\n        const c = s.color || color(i + 1);\n        const y = valueAt(s, x);\n        if (!isFinite(y)) return;\n        if (y >= api.y[0] && y \u003c= api.y[1]) svg('circle', { cx: px, cy: sy(y), r: 4.5, class: 'dk-dot', fill: c }, hg);\n        rows.push({ label: s.label || 'y', value: (o.yFormat || fmt)(y), color: c, dashed: s.dashed });\n      });\n      const custom = o.tooltip ? o.tooltip(x) : null;\n      const title = custom && custom.title != null ? custom.title : (o.xLabel ? o.xLabel + ' ' : 'x = ') + (o.hoverXFormat || o.xFormat || fmt)(x);\n      const list = custom && custom.rows ? custom.rows : rows;\n      tip.textContent = '';\n      tip.append(h('div', { class: 'dk-tip-head', text: title }));\n      for (const r of list) {\n        const key = h('i', { class: r.dashed ? 'dk-key-dash' : 'dk-key-line' });\n        key.style.color = r.color || INK.secondary;\n        tip.append(h('div', { class: 'dk-tip-row' }, key, h('span', { text: r.label }), h('span', { class: 'dk-value', text: r.value })));\n      }\n      tip.hidden = false;\n      const W = el.clientWidth;\n      const tw = tip.offsetWidth;\n      tip.style.left = (px + 14 + tw > W ? px - 14 - tw : px + 14) + 'px';\n      tip.style.top = (P.y + 4) + 'px';\n    }\n\n    root.addEventListener('pointermove', (e) => {\n      if (!api) return;\n      const r = root.getBoundingClientRect();\n      const px = e.clientX - r.left;\n      const P = api.plot;\n      if (px \u003c P.x || px > P.x + P.w || e.clientY - r.top \u003c P.y - 10 || e.clientY - r.top > P.y + P.h + 10) { hoverX = null; drawHover(null); if (o.onHover) o.onHover(null, api); return; }\n      hoverX = snapX(api.ix(px));\n      drawHover(hoverX);\n      if (o.onHover) o.onHover(hoverX, api);\n    });\n    root.addEventListener('pointerleave', () => { hoverX = null; drawHover(null); if (o.onHover) o.onHover(null, api); });\n\n    draw();\n    if (window.ResizeObserver) new ResizeObserver(() => draw()).observe(el);\n    return {\n      update(partial) { o = Object.assign(o, partial); draw(); },\n      redraw: draw,\n      get api() { return api; },\n    };\n  }\n\n  window.DK = { svg, h, color, fmt, ticks, slider, segmented, toggle, legend, stepper, arrowDefs, plot, INK, SERIES };\n})();\n\n\u003c/script>\n\u003cscript>\n  // Intel syntax, System V calling convention. Matches the create / destroy cards on the board.\n  const CODE = [\n    ['main:', 'label'],\n    ['  mov  edi, 2', '; argument'],\n    ['  call add', '; push return addr, jump'],\n    ['  mov  esi, eax', '; return point'],\n    ['add:', 'label'],\n    ['  push rbp', \"; save main's rbp\"],\n    ['  mov  rbp, rsp', '; new frame starts'],\n    ['  sub  rsp, 16', '; allocate locals'],\n    ['  mov  [rbp-4], edi', '; a = 2'],\n    ['  mov  eax, [rbp-4]', ''],\n    ['  add  eax, 3', '; return value in eax'],\n    ['  add  rsp, 16', '; free locals'],\n    ['  pop  rbp', \"; restore main's rbp\"],\n    ['  ret', '; pop return addr, jump'],\n  ];\n\n  // Stack slots, top (high address) to bottom. Slots 0-1 are main's frame.\n  const ADDR = { 1: '0x7fe0', 2: '0x7fd8', 3: '0x7fd0', 4: '0x7fc8', 5: '0x7fc0' };\n  const SLOT_Y = (k) => 30 + k * 40;\n  const POS = { '0x7ff0': SLOT_Y(0), '0x7fe0': SLOT_Y(1) + 20, '0x7fd8': SLOT_Y(2) + 20, '0x7fd0': SLOT_Y(3) + 20, '0x7fc0': SLOT_Y(5) + 20 };\n\n  // live: slots in use; stale: freed slots that still hold old bytes\n  const STEPS = [\n    { phase: 'Before the call', lines: [1], rsp: '0x7fe0', rbp: '0x7ff0', eax: '–', where: 'main', live: [], set: false,\n      text: 'main is running. rbp and rsp bracket main’s frame.' },\n    { phase: 'Create frame 1 / 4', lines: [2], target: 3, rsp: '0x7fd8', rbp: '0x7ff0', eax: '–', where: 'add', live: [2], set: false,\n      text: 'call pushes the return address (line 4, the instruction after the call) and jumps to add.' },\n    { phase: 'Create frame 2 / 4', lines: [5], rsp: '0x7fd0', rbp: '0x7ff0', eax: '–', where: 'add', live: [2, 3], set: false,\n      text: 'push rbp saves main’s base pointer. rbp still points into main’s frame.' },\n    { phase: 'Create frame 3 / 4', lines: [6], rsp: '0x7fd0', rbp: '0x7fd0', eax: '–', where: 'add', live: [2, 3], set: false,\n      text: 'mov rbp, rsp: rbp now marks the base of add’s frame. The new frame starts here.' },\n    { phase: 'Create frame 4 / 4', lines: [7], rsp: '0x7fc0', rbp: '0x7fd0', eax: '–', where: 'add', live: [2, 3, 4, 5], set: false,\n      text: 'sub rsp, 16 allocates space for locals. The stack grows toward lower addresses.' },\n    { phase: 'Body, then destroy frame 1 / 4', lines: [8, 9, 10], rsp: '0x7fc0', rbp: '0x7fd0', eax: '5', where: 'add', live: [2, 3, 4, 5], set: true,\n      text: 'The body runs (a = 2 at rbp−4), then the return value goes into eax.' },\n    { phase: 'Destroy frame 2 / 4', lines: [11], rsp: '0x7fd0', rbp: '0x7fd0', eax: '5', where: 'add', live: [2, 3], stale: [4, 5], set: true,\n      text: 'add rsp, 16 frees the locals. The bytes are still there, but they are now garbage.' },\n    { phase: 'Destroy frame 3 / 4', lines: [12], rsp: '0x7fd8', rbp: '0x7ff0', eax: '5', where: 'add', live: [2], stale: [3, 4, 5], set: true,\n      text: 'pop rbp restores main’s base pointer. add’s frame is gone.' },\n    { phase: 'Destroy frame 4 / 4', lines: [13], target: 3, rsp: '0x7fe0', rbp: '0x7ff0', eax: '5', where: 'main', live: [], stale: [2, 3, 4, 5], set: true,\n      text: 'ret pops the return address and jumps back to line 4. rsp is where it was before the call, and eax = 5.' },\n  ];\n\n  const code = document.getElementById('code');\n  for (const [t, c] of CODE) {\n    const li = DK.h('li', { class: c === 'label' ? 'label' : '' });\n    li.append(document.createTextNode(t.padEnd(19)));\n    if (c && c !== 'label') li.append(DK.h('span', { class: 'c', text: c }));\n    code.append(li);\n  }\n\n  const svg = document.getElementById('stack');\n  const arrow = DK.arrowDefs(svg, 'ptr', DK.INK.secondary);\n  const layer = DK.svg('g', null, svg);\n  let prev = null;\n\n  function cell(g, k, cls, title, sub, h = 40) {\n    const y = SLOT_Y(k);\n    const grp = DK.svg('g', { class: cls }, g);\n    DK.svg('rect', { x: 90, y: y + 1, width: 160, height: h - 2, rx: 4 }, grp);\n    if (sub) {\n      DK.svg('text', { x: 170, y: y + h / 2 - 8, class: 'th', 'text-anchor': 'middle', 'dominant-baseline': 'central', text: title }, grp);\n      DK.svg('text', { x: 170, y: y + h / 2 + 9, class: 'ts', 'text-anchor': 'middle', 'dominant-baseline': 'central', text: sub }, grp);\n    } else {\n      DK.svg('text', { x: 170, y: y + h / 2, class: 'th', 'text-anchor': 'middle', 'dominant-baseline': 'central', text: title }, grp);\n    }\n  }\n\n  function pointer(g, name, y) {\n    DK.svg('text', { x: 18, y, class: 'tmono', 'dominant-baseline': 'central', text: name }, g);\n    DK.svg('line', { x1: 50, y1: y, x2: 84, y2: y, class: 'arr', 'marker-end': arrow }, g);\n  }\n\n  function render(i) {\n    const s = STEPS[i];\n    [...code.children].forEach((li, n) => {\n      li.classList.toggle('on', s.lines.includes(n));\n      li.classList.toggle('target', s.target === n);\n    });\n\n    const regs = document.getElementById('regs');\n    regs.textContent = '';\n    regs.append(DK.h('span', { class: 'phase', text: s.phase }));\n    for (const [k, v] of [['rsp', s.rsp], ['rbp', s.rbp], ['eax', s.eax], ['running', s.where]]) {\n      const changed = prev && prev[k === 'running' ? 'where' : k] !== v;\n      regs.append(DK.h('span', { class: changed ? 'changed' : '' }, k + ' ', DK.h('b', { text: v })));\n    }\n\n    layer.textContent = '';\n    DK.svg('text', { x: 90, y: 14, class: 'ts', text: 'Higher addresses' }, layer);\n    cell(layer, 0, 'c-gray', 'main’s frame', null, 80);\n    const content = {\n      2: ['return address', 'line 4 in main', 'c-purple'],\n      3: ['saved rbp', 'main’s 0x7ff0', 'c-purple'],\n      4: ['a = ' + (s.set ? '2' : '?'), 'rbp−4', 'c-teal'],\n      5: ['padding', '16-byte alignment', 'c-teal'],\n    };\n    for (const k of [2, 3, 4, 5]) {\n      const [t, sub, c] = content[k];\n      const live = s.live.includes(k), stale = (s.stale || []).includes(k);\n      if (live) cell(layer, k, c, t, sub);\n      else if (stale) cell(layer, k, 'stale', t, 'stale');\n      if (live || stale) DK.svg('text', { x: 258, y: SLOT_Y(k) + 20, class: 'tm', 'dominant-baseline': 'central', text: ADDR[k] }, layer);\n    }\n    DK.svg('text', { x: 258, y: SLOT_Y(1) + 20, class: 'tm', 'dominant-baseline': 'central', text: ADDR[1] }, layer);\n    DK.svg('text', { x: 90, y: 296, class: 'ts', text: 'Lower addresses: the stack grows down' }, layer);\n\n    const same = s.rsp === s.rbp;\n    pointer(layer, 'rbp', POS[s.rbp] - (same ? 9 : 0));\n    pointer(layer, 'rsp', POS[s.rsp] + (same ? 9 : 0));\n\n    document.getElementById('caption').textContent = s.text;\n    prev = s;\n  }\n\n  DK.stepper(document.getElementById('nav'), { count: STEPS.length, render });\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","diagrams/stack-overflow.html":"\u003c!doctype html>\r\n\u003chtml lang=\"en\">\r\n\u003chead>\r\n\u003cmeta charset=\"utf-8\">\r\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\r\n\u003ctitle>Stack overflow\u003c/title>\r\n\u003cstyle>\n/*\n * Diagram kit: the shared look for every interactive diagram on a board.\n * Flat white surface, hairline chrome in warm grays, two font weights,\n * sentence case, color only where it carries meaning.\n * Diagrams link this file and diagram-kit.js with relative paths\n * (../../../engine/...); see engine/DIAGRAM_STYLE.md. The export script\n * inlines both, so exported boards still work offline.\n */\n:root {\n  /* surfaces and ink */\n  --surface: #ffffff;\n  --surface-1: #fcfcfb;\n  --surface-2: #f5f4f0;\n  --text-primary: #0b0b0b;\n  --text-secondary: #52514e;\n  --text-muted: #898781;\n  --grid: #ecebe5;\n  --axis: #c3c2b7;\n  --border: rgba(11, 11, 11, 0.10);\n  --border-strong: rgba(11, 11, 11, 0.20);\n  --accent: #2a78d6;\n  --highlight: rgba(250, 178, 25, 0.33);\n\n  /* series colors: always assign in this order, never cycle */\n  --series-1: #2a78d6;   /* blue */\n  --series-2: #eb6834;   /* orange */\n  --series-3: #1baf7a;   /* aqua */\n  --series-4: #eda100;   /* yellow */\n  --series-5: #e87ba4;   /* magenta */\n  --series-6: #008300;   /* green */\n  --series-7: #6250d6;   /* violet */\n  --series-8: #e34948;   /* red */\n  --context: #c3c2b7;    /* de-emphasized series */\n\n  --font: ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", sans-serif;\n  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n  --radius: 8px;\n}\n\n* { box-sizing: border-box; }\nhtml, body { margin: 0; background: var(--surface); color: var(--text-primary); }\nbody {\n  font: 400 14px/1.5 var(--font);\n  padding: 14px 18px 12px;\n  min-height: 100vh;\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n  -webkit-font-smoothing: antialiased;\n}\nb, strong, h1, h2, h3, th { font-weight: 500; }\ncode, .mono { font-family: var(--mono); font-size: 0.92em; }\n.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n\n/* ---------- layout ---------- */\n.dk-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }\n.dk-fill { flex: 1; min-height: 0; position: relative; display: flex; }\n.dk-fill > svg { flex: 1; width: 100%; height: 100%; display: block; }\n.dk-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; flex: 1; min-height: 0; }\n\n/* ---------- text ---------- */\n.dk-caption { font-size: 12px; color: var(--text-muted); }\n.dk-readout { font-size: 14px; color: var(--text-secondary); min-height: 1.5em; }\n.dk-readout b { color: var(--text-primary); }\n.dk-value { font-weight: 500; color: var(--text-primary); font-variant-numeric: tabular-nums; }\n.dk-mark { background: linear-gradient(transparent 55%, var(--highlight) 55%); }\n\n/* ---------- controls ---------- */\n.dk-control { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-secondary); }\n.dk-control output { min-width: 3.2em; color: var(--text-primary); font-weight: 500; font-variant-numeric: tabular-nums; }\ninput[type=range] { appearance: none; -webkit-appearance: none; width: 140px; height: 18px; background: transparent; margin: 0; cursor: pointer; }\ninput[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--text-primary) var(--p, 0%), var(--grid) var(--p, 0%)); }\ninput[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--grid); }\ninput[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--text-primary); }\ninput[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text-primary); }\ninput[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text-primary); }\n\nbutton, .dk-btn {\n  font: 400 13px var(--font); color: var(--text-primary); background: transparent;\n  border: 0.5px solid var(--border-strong); border-radius: var(--radius); padding: 5px 12px; cursor: pointer;\n}\nbutton:hover { background: var(--surface-2); }\nbutton:active { transform: scale(0.98); }\nbutton:disabled { color: var(--text-muted); cursor: default; background: transparent; transform: none; }\n:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n\n.dk-seg { display: inline-flex; border: 0.5px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; }\n.dk-seg button { border: 0; border-radius: 0; padding: 5px 11px; }\n.dk-seg button + button { border-left: 0.5px solid var(--border-strong); }\n.dk-seg button[aria-pressed=\"true\"] { background: var(--text-primary); color: var(--surface); }\n\n.dk-toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; user-select: none; }\n.dk-toggle input { appearance: none; -webkit-appearance: none; width: 30px; height: 18px; border-radius: 9px; background: var(--axis); position: relative; cursor: pointer; margin: 0; transition: background .15s; }\n.dk-toggle input::after { content: \"\"; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }\n.dk-toggle input:checked { background: var(--text-primary); }\n.dk-toggle input:checked::after { transform: translateX(12px); }\n\n/* ---------- legend ---------- */\n.dk-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-secondary); }\n.dk-legend span { display: inline-flex; align-items: center; gap: 6px; }\n.dk-key-line { width: 14px; height: 0; border-top: 2px solid currentColor; border-radius: 1px; }\n.dk-key-dash { width: 14px; height: 0; border-top: 2px dashed currentColor; }\n.dk-key-box { width: 10px; height: 10px; border-radius: 2px; background: currentColor; }\n\n/* ---------- step-through ---------- */\n.dk-steps { display: flex; align-items: center; gap: 12px; }\n.dk-dots { display: flex; gap: 6px; }\n.dk-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--axis); }\n.dk-dots i.on { background: var(--text-primary); }\n.dk-steps .dk-count { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }\n\n/* ---------- SVG text and marks ---------- */\nsvg text { font-family: var(--font); }\n.t  { font-size: 14px; fill: var(--text-primary); }\n.th { font-size: 14px; font-weight: 500; fill: var(--text-primary); }\n.ts { font-size: 12px; fill: var(--text-secondary); }\n.tm { font-size: 11px; fill: var(--text-muted); font-variant-numeric: tabular-nums; }\n.tmono { font-family: var(--mono); font-size: 12px; fill: var(--text-primary); }\n.dk-grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }\n.dk-axis { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }\n.dk-zero { stroke: var(--axis); stroke-width: 1; }\n.dk-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }\n.dk-area { stroke: none; opacity: 0.10; }\n.dk-dot { stroke: var(--surface); stroke-width: 2; }\n.dk-guide { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 3; fill: none; }\n.dk-crosshair { stroke: var(--text-muted); stroke-width: 1; shape-rendering: crispEdges; }\n.box { fill: var(--surface-1); stroke: var(--border-strong); stroke-width: 0.5; }\n.arr { fill: none; stroke: var(--text-secondary); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }\n.leader { fill: none; stroke: var(--text-muted); stroke-width: 0.5; stroke-dasharray: 3 3; }\n\n/* Color ramps for boxes and regions: 50 fill, 600 stroke, 800 title, 600 subtitle.\n   Use on \u003crect>/\u003ccircle>/\u003cg>. Pick 2-3 per diagram; gray for neutral structure. */\n.c-gray   { --c50:#F1EFE8; --c200:#B4B2A9; --c600:#5F5E5A; --c800:#444441; }\n.c-blue   { --c50:#E6F1FB; --c200:#85B7EB; --c600:#185FA5; --c800:#0C447C; }\n.c-teal   { --c50:#E1F5EE; --c200:#5DCAA5; --c600:#0F6E56; --c800:#085041; }\n.c-purple { --c50:#EEEDFE; --c200:#AFA9EC; --c600:#534AB7; --c800:#3C3489; }\n.c-coral  { --c50:#FAECE7; --c200:#F0997B; --c600:#993C1D; --c800:#712B13; }\n.c-pink   { --c50:#FBEAF0; --c200:#ED93B1; --c600:#993556; --c800:#72243E; }\n.c-green  { --c50:#EAF3DE; --c200:#97C459; --c600:#3B6D11; --c800:#27500A; }\n.c-amber  { --c50:#FAEEDA; --c200:#EF9F27; --c600:#854F0B; --c800:#633806; }\n.c-red    { --c50:#FCEBEB; --c200:#F09595; --c600:#A32D2D; --c800:#791F1F; }\n:is(rect, circle, ellipse, polygon):is(.c-gray, .c-blue, .c-teal, .c-purple, .c-coral, .c-pink, .c-green, .c-amber, .c-red),\n:is(.c-gray, .c-blue, .c-teal, .c-purple, .c-coral, .c-pink, .c-green, .c-amber, .c-red) > :is(rect, circle, ellipse, polygon) {\n  fill: var(--c50); stroke: var(--c600); stroke-width: 0.5;\n}\n:is(.c-gray, .c-blue, .c-teal, .c-purple, .c-coral, .c-pink, .c-green, .c-amber, .c-red) > .th,\n:is(.c-gray, .c-blue, .c-teal, .c-purple, .c-coral, .c-pink, .c-green, .c-amber, .c-red) > .t { fill: var(--c800); }\n:is(.c-gray, .c-blue, .c-teal, .c-purple, .c-coral, .c-pink, .c-green, .c-amber, .c-red) > .ts,\n:is(.c-gray, .c-blue, .c-teal, .c-purple, .c-coral, .c-pink, .c-green, .c-amber, .c-red) > .tmono { fill: var(--c600); }\n.is-active > :is(rect, circle) { stroke-width: 1.5; }\n.c-chip { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12px; background: var(--c50); color: var(--c800); }\n\n/* ---------- tooltip ---------- */\n.dk-tip {\n  position: absolute; pointer-events: none; z-index: 2;\n  background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: var(--radius);\n  padding: 6px 10px; font-size: 12px; color: var(--text-secondary); white-space: nowrap;\n  box-shadow: 0 4px 14px -6px rgba(11, 11, 11, 0.18);\n}\n.dk-tip .dk-tip-head { color: var(--text-muted); margin-bottom: 2px; font-variant-numeric: tabular-nums; }\n.dk-tip .dk-tip-row { display: flex; align-items: center; gap: 8px; }\n.dk-tip .dk-tip-row .dk-value { margin-left: auto; padding-left: 12px; }\n\n/* ---------- motion ---------- */\n.dk-anim { transition: transform .25s ease, opacity .25s ease; }\n@media (prefers-reduced-motion: reduce) { .dk-anim, .dk-toggle input, .dk-toggle input::after { transition: none; } }\n\n\u003c/style>\r\n\u003cstyle>\r\n  .limit { stroke: #A32D2D; stroke-width: 1; stroke-dasharray: 4 3; }\r\n  .lim-label { font-size: 11px; fill: #A32D2D; }\r\n\u003c/style>\r\n\u003c/head>\r\n\u003cbody>\r\n\u003ch2 class=\"sr-only\">Raise the recursion depth and watch each call add a frame; once rsp passes the stack limit the program crashes with a segmentation fault.\u003c/h2>\r\n\u003cdiv class=\"dk-row\" id=\"controls\">\u003c/div>\r\n\u003cdiv class=\"dk-fill\">\u003csvg id=\"stack\" viewBox=\"0 0 520 250\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"Stack filling up with frames\">\u003c/svg>\u003c/div>\r\n\u003cdiv class=\"dk-readout\" id=\"readout\">\u003c/div>\r\n\u003cdiv class=\"dk-caption\">Illustrative: a tiny stack that fits 10 small frames. Real stacks are about 8 MB.\u003c/div>\r\n\r\n\u003cscript>\n/*\n * Diagram kit helpers. No dependencies; everything draws plain SVG in the\n * shared style from diagram-kit.css. The main pieces:\n *\n *   DK.plot(el, opts)        function / data plot with axes, crosshair and tooltip\n *   DK.slider(parent, opts)  labelled range slider with a live value\n *   DK.segmented(parent, o)  pick-one buttons\n *   DK.toggle(parent, opts)  on/off switch\n *   DK.legend(parent, items) line / box keys (use for 2+ series)\n *   DK.stepper(parent, o)    Back / Next with dots, for step-through diagrams\n *   DK.svg(tag, attrs, parent), DK.h(tag, attrs, ...kids), DK.fmt(n), DK.color(i)\n *\n * See engine/DIAGRAM_STYLE.md for when to use each and the rules they follow.\n */\n(function () {\n  'use strict';\n  const NS = 'http://www.w3.org/2000/svg';\n  const SERIES = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'];\n  const INK = { primary: '#0b0b0b', secondary: '#52514e', muted: '#898781', grid: '#ecebe5', axis: '#c3c2b7', surface: '#ffffff', context: '#c3c2b7' };\n\n  function svg(tag, attrs, parent) {\n    const n = document.createElementNS(NS, tag);\n    for (const k in attrs || {}) {\n      const v = attrs[k];\n      if (v == null || v === false) continue;\n      if (k === 'text') n.textContent = v;\n      else n.setAttribute(k, v);\n    }\n    if (parent) parent.append(n);\n    return n;\n  }\n\n  function h(tag, attrs, ...kids) {\n    const n = document.createElement(tag);\n    for (const k in attrs || {}) {\n      const v = attrs[k];\n      if (v == null || v === false) continue;\n      if (k === 'text') n.textContent = v;\n      else if (k === 'class') n.className = v;\n      else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);\n      else n.setAttribute(k, v === true ? '' : v);\n    }\n    for (const kid of kids) if (kid != null) n.append(kid);\n    return n;\n  }\n\n  /** Series color by slot (1-based, fixed order). Pass 0 or 'context' for the gray de-emphasis color. */\n  function color(i) {\n    if (!i || i === 'context') return INK.context;\n    return SERIES[(i - 1) % SERIES.length];\n  }\n\n  /** Round for display. Uses a real minus sign, trims trailing zeros. */\n  function fmt(v, digits) {\n    if (v == null || !isFinite(v)) return '–';\n    if (digits == null) {\n      const a = Math.abs(v);\n      digits = a === 0 ? 0 : a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : 3;\n    }\n    let s = (+v.toFixed(digits)).toLocaleString('en-US', { maximumFractionDigits: digits });\n    if (s === '-0') s = '0';\n    return s.replace(/^-/, '−');\n  }\n\n  function niceStep(span, count) {\n    const raw = span / Math.max(1, count);\n    const p = Math.pow(10, Math.floor(Math.log10(raw)));\n    const m = raw / p;\n    return (m \u003c 1.5 ? 1 : m \u003c 3 ? 2 : m \u003c 7 ? 5 : 10) * p;\n  }\n  function ticks(min, max, count) {\n    const step = niceStep(max - min, count);\n    const out = [];\n    for (let v = Math.ceil(min / step) * step; v \u003c= max + step * 1e-9; v += step) out.push(Math.abs(v) \u003c step * 1e-9 ? 0 : v);\n    return { values: out, step };\n  }\n  function tickDigits(step) { return step >= 1 ? 0 : Math.min(6, Math.ceil(-Math.log10(step) - 1e-9)); }\n\n  /* ---------------- controls ---------------- */\n\n  function slider(parent, o) {\n    const out = h('output');\n    const input = h('input', { type: 'range', min: o.min, max: o.max, step: o.step ?? 'any', value: o.value, 'aria-label': o.label });\n    const show = () => {\n      out.textContent = o.format ? o.format(+input.value) : fmt(+input.value);\n      input.style.setProperty('--p', ((+input.value - o.min) / (o.max - o.min) * 100) + '%');\n    };\n    input.addEventListener('input', () => { show(); o.onInput && o.onInput(+input.value); });\n    show();\n    const wrap = h('label', { class: 'dk-control' }, o.label ? h('span', { text: o.label }) : null, input, out);\n    if (o.width) input.style.width = o.width + 'px';\n    parent.append(wrap);\n    return {\n      el: wrap, input,\n      get value() { return +input.value; },\n      set(v, silent) { input.value = v; show(); if (!silent && o.onInput) o.onInput(+input.value); },\n    };\n  }\n\n  function segmented(parent, o) {\n    let value = o.value ?? o.options[0][0];\n    const wrap = h('div', { class: 'dk-control' });\n    if (o.label) wrap.append(h('span', { text: o.label }));\n    const seg = h('div', { class: 'dk-seg', role: 'group', 'aria-label': o.label || 'Options' });\n    const buttons = o.options.map(([v, label]) => {\n      const b = h('button', { type: 'button', text: label, 'aria-pressed': String(v === value) <script>
/*
 * Whiteboard engine: renders a board (board.json) and lets you edit it.
 * No dependencies. Works in three modes:
 *   dev        - served by server.mjs; every change is saved to board.json,
 *                and edits Claude makes to board.json appear live.
 *   standalone - an exported single HTML file; "Save copy" writes a new HTML file.
 *   view       - an exported single HTML file for publishing: pan, zoom and use the
 *                diagrams, but nothing can be edited.
 */
(function () {
  'use strict';

  const SVGNS = 'http://www.w3.org/2000/svg';
  const GRID = 20, SNAP = 10;
  const BOX_TYPES = new Set(['text', 'picture', 'diagram']);
  const VARIANTS = [['card', 'Card'], ['note', 'Sticky note'], ['title', 'Title'], ['heading', 'Heading'], ['bare', 'Plain text']];
  const COLORS = ['none', 'yellow', 'green', 'blue', 'pink', 'gray'];
  const SIDES = ['left', 'right', 'top', 'bottom'];

  const ICON = {
    select: 'M6 3.5l12 7.2-5.3 1.6-2.4 5.2z',
    text: 'M5 7V5h14v2M12 5v14M9 19h6',
    arrow: 'M4 12h15M14 7l5 5-5 5',
    brace: 'M14 4c-2 0-3 1-3 3v2c0 2-1 3-3 3 2 0 3 1 3 3v2c0 2 1 3 3 3',
    picture: 'M4 5h16v14H4zM4 16l5-5 4 4 2-2 5 5M15.5 9.5h.01',
    diagram: 'M4 19V9M10 19V5M16 19v-7M3 19h18',
    undo: 'M9 5L4 10l5 5M4 10h10a5 5 0 0 1 0 10h-4',
    redo: 'M15 5l5 5-5 5M20 10H10a5 5 0 0 0 0 10h4',
    fit: 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5',
    zoom_in: 'M10.5 17.5a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4.5-4.5M7.5 10.5h6M10.5 7.5v6',
    zoom_out: 'M10.5 17.5a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4.5-4.5M7.5 10.5h6',
    help: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5h.01',
    export: 'M12 4v11M7 10l5 5 5-5M5 20h14',
    trash: 'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',
    close: 'M6 6l12 12M18 6L6 18',
    side_left: 'M14 4c-2 0-3 1-3 3v2c0 2-1 3-3 3 2 0 3 1 3 3v2c0 2 1 3 3 3',
    side_right: 'M10 4c2 0 3 1 3 3v2c0 2 1 3 3 3-2 0-3 1-3 3v2c0 2-1 3-3 3',
    side_top: 'M4 14c0-2 1-3 3-3h2c2 0 3-1 3-3 0 2 1 3 3 3h2c2 0 3 1 3 3',
    side_bottom: 'M4 10c0 2 1 3 3 3h2c2 0 3 1 3 3 0-2 1-3 3-3h2c2 0 3-1 3-3',
  };

  const WB = (window.WB = {});
  let cfg = null, board = null, rev = 0;
  let assets = {}, diagrams = {}, pristine = '';
  const view = { x: 0, y: 0, z: 1 };
  let selected = new Set();
  let tool = 'select';
  let draftStyle = 'sequence';
  let undoStack = [], redoStack = [];
  let saveState = 'saved', saveMessage = '';
  let saveTimer = null, saving = false, saveQueued = false;
  let editing = null, editSnapshot = null, editIsNew = false;
  let gesture = null;
  let pendingRemote = false;
  let arrowDraft = null;
  let labelCtx = null;
  let spaceDown = false;
  const pointers = new Map();   // active touch pointers: pointerId -> { x, y } (client coords)
  let touchStart = null;        // state before a one-finger touch, so a pinch can undo what that finger did
  let lastPinchEnd = 0;
  let ready = false;
  let ro = null, linkFrame = 0, viewTimer = null, toastTimer = null;
  const nodes = new Map();
  const braceCache = new Map();
  const bust = {};
  const ui = {};

  /* ---------------- helpers ---------------- */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const k in attrs || {}) {
      const v = attrs[k];

      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);

  }
  function s(tag, attrs) {

    return el;
  }
  function icon(name) {
    const svg = s('svg', { viewBox: '0 0 24 24', class: 'wb-ico', 'aria-hidden': 'true' });
    svg.append(s('path', { d: ICON[name] }));
    return svg;
  }
  const byId = (id) => board.elements.find((e) => e.id === id);
  const isBox = (e) => !!e && BOX_TYPES.has(e.type);
  const snap = (v, step = SNAP) => Math.round(v / step) * step;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const enc = encodeURIComponent;
  function uid(prefix) {
    let id;
    do id = prefix + '-' + Math.random().toString(36).slice(2, 6); while (byId(id));
    return id;
  }
  function storage(key, val) {
    try {
      if (val === undefined) return localStorage.getItem(key);

    } catch (e) { /* storage unavailable: views just are not remembered */ }

  }
  function single() { return selected.size === 1 ? byId([...selected][0]) : null; }
  const isView = () => cfg.mode === 'view';

  function normalize(b) {
    if (!b || typeof b !== 'object') b = {};
    if (!Array.isArray(b.elements)) b.elements = [];
    const seen = new Set();
    b.elements = b.elements.filter((e) => e && typeof e === 'object' && typeof e.type === 'string');
    for (const e of b.elements) {
      if (typeof e.id !== 'string' || !e.id || seen.has(e.id)) e.id = e.type + '-' + Math.random().toString(36).slice(2, 6);

      if (e.type === 'picture') { e.w = e.w || 240; e.h = e.h || 180; }
      if (e.type === 'diagram') { e.w = e.w || 420; e.h = e.h || 300; }

  function assetURL(src) {
    if (!src) return '';
    if (/^(https?:|data:|blob:)/.test(src)) return src;
    if (cfg.mode !== 'dev') return assets[src] || src;
    return '/boards/' + enc(cfg.board) + '/' + src.split('/').map(enc).join('/') + (bust[src] ? '?v=' + bust[src] : '');

    let out = esc(t || '');

  /* ---------------- boot ---------------- */
  WB.boot = async function (opts) {

    } else {

      if (!r.ok) { document.body.textContent = 'Could not load board "' + cfg.board + '": ' + (await r.text()); return; }
      const j = await r.json();

    }

    document.title = board.title || cfg.board || 'Whiteboard';
    if (window.ResizeObserver) ro = new ResizeObserver(() => scheduleLinks());

    render();
    const saved = storage('wb-view:' + (cfg.board || board.title));
    let restored = false;
    if (saved) { try { Object.assign(view, JSON.parse(saved)); restored = true; } catch (e) { /* ignore */ } }
    if (restored) applyView(); else fit();
    if (cfg.mode === 'dev') connectEvents();
    window.addEventListener('beforeunload', (ev) => {
      if (cfg.mode === 'standalone' && saveState === 'unsaved') { ev.preventDefault(); ev.returnValue = ''; }
      if (cfg.mode === 'dev' && (saveTimer || saving)) { ev.preventDefault(); ev.returnValue = ''; }
    });
    ready = true;
  };
  WB.isReady = () => ready;
  WB.getBoard = () => JSON.parse(JSON.stringify(board));

  /* ---------------- UI scaffold ---------------- */
  function buildUI() {
    const root = document.getElementById('wb-root');
    root.textContent = '';
    ui.stage = h('div', { class: 'wb-stage' + (isView() ? ' is-view' : ''), tabindex: '-1' });
    ui.world = h('div', { class: 'wb-world' });
    ui.boxes = h('div', { class: 'wb-boxes' });
    ui.svg = s('svg', { class: 'wb-links', width: '1', height: '1' });        // arrows + braces, under the boxes
    ui.overlay = s('svg', { class: 'wb-links', width: '1', height: '1' });    // handles + arrow draft, on top
    ui.world.append(ui.svg, ui.boxes, ui.overlay);
    ui.marquee = h('div', { class: 'wb-marquee', hidden: true });
    ui.stage.append(ui.world, ui.marquee);
    ui.title = h('div', { class: 'wb-board-title' });
    ui.status = h('div', { class: 'wb-status', role: 'status', hidden: isView() });

    ui.file.addEventListener('change', () => { addImageFiles([...ui.file.files], centerPoint()); ui.file.value = ''; });
    ui.editorInput = h('input', { type: 'text', 'aria-label': 'Label' });
    ui.editor = h('div', { class: 'wb-label-editor', hidden: true }, ui.editorInput);
    root.append(ui.stage, ui.top, ui.tray, ui.toast, ui.help, ui.file, ui.editor);
    bindEvents();
  }

  function buildHelp() {
    const rows = (pairs) => {
      const dl = h('dl');
      for (const [k, v] of pairs) dl.append(h('dt', null, ...k.split(' ').map((x) => h('kbd', { text: x }))), h('dd', { text: v }));
